                  const p=S.players.find(x=>x.id===pid); if(!p) return '';
                  const pd=ensurePD(d,pid); const mins=pdMinutes(pd);
                  const pct = mins!=null && d.totalMinutes>0 ? Math.round(mins/d.totalMinutes*100) : null;
                  const st = inSquad.has(pid) ? '' : 'opacity:.5';
                  return `<tr style="${st}">
                    <td><b>${p.num}</b></td>
                    <td style="white-space:nowrap"><span data-open-player="${p.id}" data-att="1" style="cursor:pointer;font-weight:600" title="Doppelklick: Profil">${esc(p.name)}</span>${inSquad.has(pid)?'':' <span class="chip" style="font-size:9.5px;padding:1px 6px">n. i. K.</span>'}</td>
                    <td><input class="input" style="width:56px" type="number" min="0" data-pd="${pid}|from" value="${pd.from??''}"></td>
                    <td><input class="input" style="width:56px" type="number" min="0" data-pd="${pid}|to" value="${pd.to??''}"></td>
                    <td style="font-weight:650;font-variant-numeric:tabular-nums">${mins??'–'}</td>
                    <td style="font-variant-numeric:tabular-nums">${pct!=null?pct+'%':'–'}</td>
                    <td><select class="select" style="width:66px;padding:5px 22px 5px 8px" data-pd="${pid}|position">${POS.map(x=>`<option ${x===pd.position?'selected':''}>${x}</option>`).join('')}</select></td>
                    <td><input class="input" style="width:58px" type="number" min="1" max="10" step="0.5" data-pd="${pid}|rating" value="${pd.rating??''}"></td>
                    <td><input class="input" style="min-width:120px" data-pd="${pid}|events" value="${esc((pd.events||[]).join(', '))}" placeholder="Tor, Gelb …"></td>
                    <td><input class="input" style="min-width:150px" data-pd="${pid}|note" value="${esc(pd.note||'')}"></td>
                  </tr>`; }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>`;

  /* Bindings */
  $('#mcVoice').onclick = ()=> startVoice($('#mcVoice'), txt=>{ $('#mcText').value=($('#mcText').value+' '+txt).trim(); runMatchParse(); });
  $('#mcTextFocus').onclick = ()=> $('#mcText').focus();
  $('#mcFile').onclick = ()=> $('#mcFileInput').click();
  $('#mcFileInput').onchange = e=>{ handleUpload(e.target.files[0], txt=>{ $('#mcText').value=txt; runMatchParse(); }); e.target.value=''; };
  $('#mcParse').onclick = runMatchParse;
  $('#mcApply').onclick = ()=>{ if(!matchFindings) runMatchParse(); applyMatchFindings(); };
  if($('#mcClear')) $('#mcClear').onclick = ()=>{ matchFindings=null; render(); };

  $('#mOpp').oninput = e=>{ d.opponent=e.target.value; saveAll(); };
  $('#mtDate').onchange = e=>{ d.date=e.target.value; saveAll(); };
  $('#mGf').oninput = e=>{ d.goalsFor=e.target.value===''?null:+e.target.value; saveAll(); };
  $('#mGa').oninput = e=>{ d.goalsAgainst=e.target.value===''?null:+e.target.value; saveAll(); };
  $('#mTotal').oninput = e=>{ d.totalMinutes=parseInt(e.target.value)||0; saveAll(); };
  $('#mComp2').oninput = e=>{ d.competition=e.target.value; saveAll(); };
  $('#mTeamNotes').oninput = e=>{ d.teamNotes=e.target.value; saveAll(); };
  $('#mConclusion').oninput = e=>{ d.conclusion=e.target.value; saveAll(); };

  $$('[data-pd]').forEach(el=> el.addEventListener('change', ()=>{
    const [pid,f]=el.dataset.pd.split('|');
    const pd=ensurePD(d,pid);
    if(f==='events') pd.events = el.value.split(',').map(s=>s.trim()).filter(Boolean);
    else if(f==='note') pd.note = el.value;
    else if(f==='position') pd.position = el.value;
    else pd[f] = el.value===''?null:parseFloat(el.value);
    saveAll(); renderSpiel();
  }));

  bindPlayerOpen();
  if(matchFindings) renderMatchFindings();
}

function runMatchParse(){
  const text = $('#mcText').value.trim();
  if(!text){ toast('Bitte zuerst Notizen eingeben, diktieren oder hochladen','info'); return; }
  const res = parseMatchText(text);
  matchFindings = {
    team: Object.keys(res.team).length ? {...res.team, on:true} : null,
    rows: res.rows.map(r=>({...r, on:true}))
  };
  if(!matchFindings.team && !matchFindings.rows.length){
    toast('Keine verwertbaren Informationen erkannt','info'); matchFindings=null;
  }
  renderSpiel();
}

function renderMatchFindings(){
  const host = $('#mcFindings'); if(!host || !matchFindings) return;
  const f = matchFindings;
  let html = '';
  if(f.team){
    const parts = [];
    if(f.team.opponent) parts.push('Gegner: <b>'+esc(f.team.opponent)+'</b>');
    if(f.team.goalsFor!=null) parts.push('Ergebnis: <b>'+f.team.goalsFor+' : '+f.team.goalsAgainst+'</b>');
    if(f.team.competition) parts.push('Wettbewerb: <b>'+esc(f.team.competition)+'</b>');
    if(f.team.totalMinutes) parts.push('Spielzeit: <b>'+f.team.totalMinutes+' Min</b>');
    if(f.team.notes) parts.push('Teamnotiz: <i>„'+esc(f.team.notes)+'“</i>');
    html += `<div class="finding ${f.team.on?'':'off'}">
      <button class="f-toggle" data-mft="team">${svgI(I.check,12)}</button>
      <div class="f-main"><b>Teaminfos</b><div class="f-sub">${parts.join(' · ')}</div></div>
      <div class="f-tag"><span class="chip navy">Team</span></div>
    </div>`;
  }
  html += f.rows.map((r,i)=>{
    const p=S.players.find(x=>x.id===r.pid);
    const bits=[];
    if(r.from!=null||r.to!=null) bits.push(`Einsatz <b>${r.from??'?'}’ – ${r.to??'?'}’</b>`);
    if(r.rating!=null) bits.push(`Note <b>${r.rating}</b>`);
    if(r.position) bits.push(`Position <b>${r.position}</b>`);
    if(r.events.length) bits.push(r.events.map(e=>`<span class="chip ${e==='Tor'?'green':e.includes('Karte')||e==='Gelb-Rot'?'amber':e==='Verletzung'?'red':'blue'}" style="font-size:10px;padding:1px 7px">${e}</span>`).join(' '));
    return `<div class="finding ${r.on?'':'off'}">
      <button class="f-toggle" data-mft="${i}">${svgI(I.check,12)}</button>
      <div class="f-main"><b>${esc(p?p.name:'?')}</b>
        <div class="f-sub">${bits.join(' · ')||'Notiz'}</div>
        <div class="f-sub" style="font-style:italic">„${esc(r.notes.join(' '))}“</div>
      </div>
    </div>`;
  }).join('');
  host.innerHTML = html || '<p class="tiny">Nichts erkannt.</p>';
  $$('[data-mft]', host).forEach(b=> b.onclick = ()=>{
    if(b.dataset.mft==='team') f.team.on=!f.team.on;
    else f.rows[+b.dataset.mft].on=!f.rows[+b.dataset.mft].on;
    renderMatchFindings();
    $$('[data-mft]',host); /* re-bound in renderMatchFindings */
  });
}

function applyMatchFindings(){
  if(!matchFindings){ return; }
  const d = S.matchDraft;
  let n=0;
  const f = matchFindings;
  if(f.team && f.team.on){
    if(f.team.opponent && !d.opponent) d.opponent=f.team.opponent;
    else if(f.team.opponent) d.opponent=f.team.opponent;
    if(f.team.goalsFor!=null){ d.goalsFor=f.team.goalsFor; d.goalsAgainst=f.team.goalsAgainst; }
    if(f.team.competition) d.competition=f.team.competition;
    if(f.team.totalMinutes) d.totalMinutes=f.team.totalMinutes;
    if(f.team.notes) d.teamNotes = (d.teamNotes? d.teamNotes+' ':'') + f.team.notes;
    n++;
  }
  f.rows.filter(r=>r.on).forEach(r=>{
    const pd = ensurePD(d, r.pid);
    if(r.from!=null) pd.from=r.from;
    if(r.to!=null) pd.to=r.to;
    if(r.rating!=null) pd.rating=r.rating;
    if(r.position) pd.position=r.position;
    if(r.events.length) pd.events=[...(pd.events||[]), ...r.events];
    if(r.notes.length) pd.note = ((pd.note||'')+' '+r.notes.join(' ')).trim();
    const p=S.players.find(x=>x.id===r.pid);
    if(p){
      if(r.events.includes('Verletzung')){ p.status='angeschlagen'; logHist(p.id,'Aus Spielerfassung: Verletzung vermerkt'); }
      logHist(p.id, `Spieldaten ${d.opponent?('vs. '+d.opponent):''} übernommen${r.rating!=null?': Note '+r.rating:''}${r.events.length?', '+r.events.join(', '):''}`);
    }
    n++;
  });
  matchFindings=null;
  $('#mcText') && ($('#mcText').value='');
  saveAll(); renderSpiel();
  toast(n? `${n} ${n>1?'Einträge':'Eintrag'} übernommen — bitte prüfen und speichern` : 'Nichts ausgewählt', n?'check':'info');
}

/* ---------- Spielarchiv (identische Bedienlogik wie Trainingsarchiv) ---------- */
let matchSearch='', matchFrom='', matchTo='';
function renderMatchArchive(tabs){
  setTopbar('Spiel', `${S.matches.length} Spiele im Archiv`, `
    <button class="btn btn-accent" id="mNew2">${svgI(I.plus,15)} Neues Spiel</button>
  `);
  const list = S.matches.slice()
    .filter(m=>{
      const q=lc(matchSearch);
      if(q && !(lc(m.opponent).includes(q) || lc(m.competition||'').includes(q))) return false;
      if(matchFrom && m.date<matchFrom) return false;
      if(matchTo && m.date>matchTo) return false;
      return true;
    })
    .sort((a,b)=>b.date.localeCompare(a.date));

  $('#view').innerHTML = `
    <div style="margin-bottom:18px">${tabs}</div>
    <div class="card" style="margin-bottom:16px"><div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="search-wrap">${svgI(I.search,15)}<input class="input" id="maSearch" placeholder="Gegner oder Wettbewerb suchen …" value="${esc(matchSearch)}"></div>
      <div class="field" style="width:150px"><label>Von</label><input class="input" id="maFrom" type="date" value="${esc(matchFrom)}"></div>
      <div class="field" style="width:150px"><label>Bis</label><input class="input" id="maTo" type="date" value="${esc(matchTo)}"></div>
      ${(matchSearch||matchFrom||matchTo)?`<button class="btn btn-ghost btn-sm" id="maReset">Zurücksetzen</button>`:''}
    </div></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${list.length? list.map(m=>{ const ds=fmtDShort(m.date); return `
        <div class="arch-item">
          <div class="arch-date"><b>${ds.d}</b><span>${ds.m}</span></div>
          <span class="result-pill ${resultCls(m)}">${m.goalsFor??'–'} : ${m.goalsAgainst??'–'}</span>
          <div class="arch-main">
            <div class="a-title">vs. ${esc(m.opponent)}</div>
            <div class="a-sub">${esc(m.competition||'')} · ${esc(m.venue||'')} · ${m.totalMinutes} Min · ${m.lineup.field.length} auf dem Feld</div>
          </div>
          <div class="arch-actions">
            <button class="btn btn-sm btn-ghost" data-mopen="${m.id}">${svgI(I.eye,14)} Öffnen</button>
            <button class="btn btn-sm btn-ghost" data-mcap="${m.id}" title="Sprache / Text / Datei nachträglich hinzufügen">${svgI(I.mic,14)} Erfassen</button>
            <button class="btn btn-sm btn-ghost" data-mprint="${m.id}">${svgI(I.print,14)}</button>
            <button class="icon-btn" data-mdel="${m.id}">${svgI(I.trash,15)}</button>
          </div>
        </div>`; }).join('') : `<div class="card card-pad" style="text-align:center"><p class="muted">Keine Spiele gefunden.</p></div>`}
    </div>`;

  $('#mNew2').onclick = ()=>{ S.matchDraft=newMatchDraft(); saveAll(); route.spielTab='lineup'; render(); };
  $('#maSearch').oninput = e=>{ matchSearch=e.target.value; renderSpiel(); };
  $('#maFrom').onchange = e=>{ matchFrom=e.target.value; renderSpiel(); };
  $('#maTo').onchange = e=>{ matchTo=e.target.value; renderSpiel(); };
  if($('#maReset')) $('#maReset').onclick = ()=>{ matchSearch=matchFrom=matchTo=''; renderSpiel(); };
  $$('[data-mopen]').forEach(b=> b.onclick = ()=> openMatchForEdit(b.dataset.mopen));
  $$('[data-mcap]').forEach(b=> b.onclick = ()=>{ openMatchForEdit(b.dataset.mcap); route.spielTab='capture'; render(); });
  $$('[data-mprint]').forEach(b=> b.onclick = ()=>{ const m=S.matches.find(x=>x.id===b.dataset.mprint); if(m) printMatch(m); });
  $$('[data-mdel]').forEach(b=> b.onclick = ()=>{
    const m=S.matches.find(x=>x.id===b.dataset.mdel);
    confirmDlg('Spiel löschen', `Das Spiel gegen ${m.opponent||'—'} wird dauerhaft entfernt.`, 'Löschen', ()=>{
      S.matches=S.matches.filter(x=>x.id!==m.id); saveAll(); renderSpiel(); toast('Spiel gelöscht');
    });
  });
}

/* ---------- Druck: Spiel (DIN A4) ---------- */
function printMatch(m){
  const byId = pid => S.players.find(p=>p.id===pid);
  printSheet(`
  <div class="pr-doc">
    <div class="pr-head">
      <div>
        <div class="pr-brand">${esc(S.clubName)} · ${esc(S.teamName)} · Spieltag</div>
        <h1>${esc(S.clubName)} ${esc(S.teamName)} — ${esc(m.opponent||'Gegner')}</h1>
      </div>
      <div class="pr-meta">
        <b>${fmtDLong(m.date)}</b><br>
        Anstoß ${esc(m.time||'–')} Uhr · ${esc(m.venue||'')}<br>
        ${esc(m.competition||'')}${m.goalsFor!=null?` · Endstand <b>${m.goalsFor} : ${m.goalsAgainst}</b>`:''}
      </div>
    </div>

    <div class="pr-sec">
      <h2>Aufstellung (${m.lineup.field.length})</h2>
      <div class="pr-lineup">
        ${pitchLinesSVG(true)}
        ${m.lineup.field.map(f=>{ const p=byId(f.pid); if(!p) return ''; return `
          <div class="pr-lu-tok ${p.pos==='TW'?'gk':''}" style="left:${f.x}%;top:${f.y}%">
            <div class="d">${p.num}</div><div class="nm">${esc(p.first)} ${esc((p.name.split(' ')[1]||'').slice(0,1))}.</div>
          </div>`; }).join('')}
      </div>
    </div>

    <div class="pr-cols">
      <div class="pr-sec">
        <h2>Bank (${m.lineup.bench.length})</h2>
        <div class="pr-names">${m.lineup.bench.map(pid=>{ const p=byId(pid); return p?`<span>#${p.num} ${esc(p.name)}</span>`:''; }).join('')||'<span>—</span>'}</div>
      </div>
      <div class="pr-sec">
        <h2>Nicht im Kader (${m.lineup.out.length})</h2>
        <div class="pr-names">${m.lineup.out.map(pid=>{ const p=byId(pid); return p?`<span>#${p.num} ${esc(p.name)}</span>`:''; }).join('')||'<span>—</span>'}</div>
      </div>
    </div>

    ${m.teamNotes||m.conclusion?`
    <div class="pr-sec">
      <h2>Notizen</h2>
      ${m.teamNotes?`<p style="font-size:11px;margin-bottom:4px"><b>Team:</b> ${esc(m.teamNotes)}</p>`:''}
      ${m.conclusion?`<p style="font-size:11px"><b>Fazit:</b> ${esc(m.conclusion)}</p>`:''}
    </div>`:''}
  </div>`);
}

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  S = loadAll();
  if(!S || S.version!==1){
    S = freshState();
    seedFirstMatch(S);
    saveAll();
  }
  render();
})();
</script>
