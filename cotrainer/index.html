function addNote(p, text, source, ref, impact, tags, ts){
  if(!text || !String(text).trim()) return;
  p.notesLog = p.notesLog || [];
  p.notesLog.push({ id:uid(), ts: ts || new Date().toISOString(), source: source||'Manuelle Notiz', ref: ref||'', text: String(text).trim(), impact: impact??null, tags: tags||[] });
  if(p.notesLog.length > 300) p.notesLog = p.notesLog.slice(-300);
}

/* ============================================================
   CO.TRAINER — Chat pro Spieler (regelbasiert, nur lokale Daten)
   Antwortet ausschließlich anhand aller gespeicherten Daten des
   Spielers: Bewertungen, Historie, Notizen, Match-Impact, Tore,
   Vorlagen, Positionen und Feedbacktexte.
   ============================================================ */
function coTrainerAnswer(p, qRaw){
  const q = lc(qRaw);
  const st = playerStats(p.id);
  const notes = (p.notesLog||[]).slice().sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
  const hist = S.history.filter(h=>h.pid===p.id).sort((a,b)=>b.ts.localeCompare(a.ts));
  const ana = analyzePlayerNotes(p);
  const dimsSorted = DIMS.map(d=>({d, v:dimAvg(p.dims[d.key]||[65])})).sort((a,b)=>b.v-a.v);
  const best = dimsSorted[0], worst = dimsSorted[dimsSorted.length-1];
  const o = overallOf(p);
  const isPosNote = n => (n.impact!=null && n.impact>0) || (hasAny(lc(n.text||''), POSWORDS.map(lc)) && !hasAny(lc(n.text||''), NEGWORDS.map(lc)));
  const isNegNote = n => (n.impact!=null && n.impact<0) || (hasAny(lc(n.text||''), NEGWORDS.map(lc)) && !hasAny(lc(n.text||''), POSWORDS.map(lc)));
  const posNotes = notes.filter(isPosNote), negNotes = notes.filter(isNegNote);
  const quote = n => `„${String(n.text).slice(0,90)}${String(n.text).length>90?'…':''}“ (${fmtD(String(n.ts).slice(0,10))}${n.ref?', vs. '+n.ref:''})`;

  /* Was lobe ich am meisten? / Stärken */
  if(/(lobe|lob |am meisten positiv|häufigste stärke|was.*stärk|stärken)/.test(q)){
    const praised = ana.strengths.length ? ana.strengths : [best.d.label];
    let a = `Am meisten lobst du bei ${p.first}: ${praised.join(', ')}.`;
    a += ` Im Bewertungsprofil ist ${best.d.label} mit ${best.v} sein stärkster Bereich.`;
    if(p.specials.length) a += ` Besondere Fähigkeit: ${p.specials.map(s=>s.t).join('; ')}.`;
    if(posNotes.length) a += `\n\nBeispiele aus deinen Notizen:\n• ${posNotes.slice(0,2).map(quote).join('\n• ')}`;
    return a;
  }
  /* Beste Position */
  if(/(beste position|welche position|wo.*einsetzen|position.*am besten)/.test(q)){
    let a = `Stammposition laut Profil: ${posLabel(p.pos)}.`;
    if(st.bestPos && Object.keys(st.posCount||{}).length){
      const mins = st.posCount[st.bestPos];
      a += ` In den erfassten Spielen kam er am längsten als ${posLabel(st.bestPos)} zum Einsatz (${mins} Min).`;
      if(st.bestPos!==p.pos) a += ` Das weicht von der Stammposition ab — ein Blick auf den Impact je Position lohnt sich.`;
    } else {
      a += ` Aus den Spielen liegen noch keine belastbaren Positionsdaten vor.`;
    }
    if(st.avgImpact!=null) a += ` Ø Match-Impact insgesamt: ${st.avgImpact>0?'+':''}${st.avgImpact}.`;
    a += ` Bewertungsseitig sprechen ${best.d.label} (${best.v}) und die Gesamtbewertung ${o} („${ratingBand(o).label}“) für seine aktuelle Rolle.`;
    return a;
  }
  /* Wie viele positive/negative Bewertungen? */
  if(/(wie viele|anzahl).*(positiv|gute)/.test(q) || /positive bewertungen/.test(q)){
    const up = hist.filter(h=>(h.delta||0)>0).length;
    return `Du hast ${p.first} ${posNotes.length} positive Einträge gegeben (Notizen und Spielbewertungen mit positivem Impact). Dazu kommen ${up} positive Profil-Anpassungen in der Historie.${posNotes.length?`\n\nZuletzt: ${quote(posNotes[0])}`:''}`;
  }
  if(/(wie viele|anzahl).*(negativ|schlechte|kriti)/.test(q) || /negative bewertungen/.test(q)){
    const down = hist.filter(h=>(h.delta||0)<0).length;
    return `Es gibt ${negNotes.length} kritische Einträge (Notizen/Spielbewertungen mit negativem Impact) und ${down} negative Profil-Anpassungen.${negNotes.length?`\n\nZuletzt: ${quote(negNotes[0])}`:''}`;
  }
  /* Entwicklungsfeld / Schwächen */
  if(/(entwicklungsfeld|schwäche|verbessern|woran.*arbeiten|entwickeln|trainieren)/.test(q)){
    let a = `Wichtigstes Entwicklungsfeld: ${worst.d.label} (aktuell ${worst.v}).`;
    if(ana.problems.length) a += ` Deine Notizen zeigen wiederkehrende Probleme bei: ${ana.problems.join(', ')}.`;
    a += `\nEmpfohlener Trainingsfokus: ${ana.reco}.`;
    if(negNotes.length) a += `\n\nBeleg aus den Notizen: ${quote(negNotes[0])}`;
    return a;
  }
  /* Tore / Vorlagen / Scorer */
  if(/(tor|tore|vorlage|assist|scorer)/.test(q)){
    return `${p.first} steht bei ${st.goals} Tor${st.goals===1?'':'en'} und ${st.assists} Vorlage${st.assists===1?'':'n'} (${st.scorer} Scorerpunkte) aus ${st.games} erfassten Einsätzen.${st.avgImpact!=null?` Ø Impact: ${st.avgImpact>0?'+':''}${st.avgImpact}.`:''}`;
  }
  /* Spielzeit / Einsätze */
  if(/(spielzeit|minuten|einsätze|wie oft gespielt|spiele)/.test(q)){
    return `${st.games} Einsätze (${st.starts} von Beginn, ${st.subs} eingewechselt), insgesamt ${st.minutes} Minuten${st.pct!=null?` — das sind ${st.pct}% der möglichen Spielzeit (Basis: 100%-Spielzeit je Spiel)`:''}.${st.bestPos?` Meiste Minuten als ${posLabel(st.bestPos)}.`:''}`;
  }
  /* Karten / Disziplin */
  if(/(karte|gelb|rot|disziplin)/.test(q)){
    const disc = (DIM_BY_KEY['verhalten'] && p.dims['verhalten']) ? ` Disziplin-Wert im Profil: ${p.dims['verhalten'][1]??'–'}.` : '';
    return `${st.yellow} gelbe und ${st.red} rote Karten in den erfassten Spielen.${disc}`;
  }
  /* Trend / Entwicklung */
  if(/(trend|entwicklung|entwickelt|fortschritt)/.test(q)){
    let a = `Entwicklungstrend: ${ana.trend}${ana.trendSum?` (${ana.trendSum>0?'+':''}${ana.trendSum} Punkte über die letzten Anpassungen)`:''}.`;
    if(hist.length) a += `\nLetzte Änderungen:\n• ${hist.slice(0,3).map(h=>`${fmtD(h.ts.slice(0,10))}: ${h.text}`).join('\n• ')}`;
    return a;
  }
  /* Besondere Fähigkeiten */
  if(/(fähigkeit|spezial|besonder|kann er gut)/.test(q)){
    return p.specials.length ? `Notierte besondere Fähigkeiten: ${p.specials.map(s=>`${s.t} (${'★'.repeat(s.s||3)})`).join('; ')}.` : `Für ${p.first} sind noch keine besonderen Fähigkeiten hinterlegt.`;
  }
  /* Status */
  if(/(status|fit|verletz|einsatzbereit|krank)/.test(q)){
    return `Aktueller Status: ${p.status}.${p.status!=='fit'?' Bitte Belastung entsprechend steuern.':''}`;
  }
  /* Feedback */
  if(/(feedback|elterngespräch|zeugnis)/.test(q)){
    autoFeedbackTexts(p);
    return `Feedback-Basis für ${p.first}:\nStärken: ${p.fb.strengths||'—'}\nEntwicklungsfelder: ${p.fb.weaknesses||'—'}\nEmpfehlung: ${p.fb.recommendation||'—'}`;
  }
  /* Fallback: Gesamtüberblick */
  return `Überblick ${p.first} ${p.name.split(' ').slice(1).join(' ')}: Gesamtbewertung ${o} („${ratingBand(o).label}“), stärkster Bereich ${best.d.label} (${best.v}), größtes Entwicklungsfeld ${worst.d.label} (${worst.v}). ${st.games} Einsätze, ${st.goals} Tore, ${st.assists} Vorlagen${st.pct!=null?`, ${st.pct}% Spielzeit`:''}. ${notes.length} Archiv-Einträge, Trend ${ana.trend}.\n\nDu kannst mich z. B. fragen: „Was lobe ich am meisten?“, „Was ist seine beste Position?“, „Wie viele positive Bewertungen habe ich gegeben?“, „Was ist sein wichtigstes Entwicklungsfeld?“`;
}

];

function bindCoTrainer(p){
  const ask = qText => {
    const q = (qText||'').trim(); if(!q) return;
    p.coTrainerChat = p.coTrainerChat||[];
    p.coTrainerChat.push({ role:'q', text:q, ts:new Date().toISOString() });
    p.coTrainerChat.push({ role:'a', text:coTrainerAnswer(p, q), ts:new Date().toISOString() });
    if(p.coTrainerChat.length>60) p.coTrainerChat = p.coTrainerChat.slice(-60);
    saveAll(); renderPlayerProfile(p.id);
    setTimeout(()=>{ const c=$('#ctChat'); if(c) c.scrollTop = c.scrollHeight; }, 30);
  };
  const inp = $('#ctInput');
  if($('#ctSend')) $('#ctSend').onclick = ()=> ask(inp.value);
  if(inp) inp.onkeydown = e=>{ if(e.key==='Enter') ask(inp.value); };
  $$('[data-ctsug]').forEach(b=> b.onclick = ()=> ask(CT_SUGGESTIONS[+b.dataset.ctsug]));
  $$('[data-ctexport]').forEach(b=> b.onclick = ()=>{
    const m = (p.coTrainerChat||[])[+b.dataset.ctexport]; if(!m) return;
    addNote(p, m.text, 'Co.Trainer');
    logHist(p.id, 'Co.Trainer-Einschätzung in die Notizen übernommen');
    saveAll(); renderPlayerProfile(p.id);
    toast('In Notizen/Archiv übernommen — fließt auch in den Feedbackbogen ein');
  });
  const c = $('#ctChat'); if(c) c.scrollTop = c.scrollHeight;
}

  $('#pcVoice').onclick = ()=> startVoice($('#pcVoice'), txt=>{ profileInputSource='Sprache/Text'; $('#pcText').value = ($('#pcText').value+' '+txt).trim(); runProfileParse(p); });
  $('#pcFile').onclick = ()=> $('#pcFileInput').click();
  $('#pcFileInput').onchange = e=>{ handleUpload(e.target.files[0], txt=>{ profileInputSource='Dateiimport'; $('#pcText').value = txt; runProfileParse(p); }); e.target.value=''; };
  $('#pcParse').onclick = ()=>{ if(profileInputSource!=='Sprache/Text' && profileInputSource!=='Dateiimport') profileInputSource='Manuelle Notiz'; runProfileParse(p); };
  const pcTextEl = $('#pcText');
  if(pcTextEl) pcTextEl.addEventListener('input', ()=>{ profileInputSource='Manuelle Notiz'; });
}

function runProfileParse(p){
  const text = $('#pcText').value.trim();
  if(!text){ toast('Bitte zuerst Text eingeben oder diktieren','info'); return; }
  profileFindings = parseProfileText(text, p).map(f=>({...f, on:true}));
  renderProfileFindings(p);
  if(!profileFindings.length) toast('Keine verwertbaren Informationen erkannt','info');
}

function renderProfileFindings(p){
  const host = $('#pcFindings'); if(!host) return;
  if(!profileFindings.length){ host.innerHTML=''; return; }
  host.innerHTML = profileFindings.map((f,i)=>{
    let tag='', main='';
    if(f.kind==='dim'){
      const d=DIM_BY_KEY[f.dim]; const cur=dimAvg(p.dims[f.dim]);
      const sim = simulateDelta(p, f);
      tag = `<span class="chip ${f.dir>0?'green':'red'}">${d.label} ${f.dir>0?'+':'−'}</span>`;
      main = `<b>${d.label}: ${cur} → ${sim}</b><div class="f-sub">${f.metrics.length? 'Nur: '+f.metrics.map(m=>d.metrics[m]).join(', ') : 'Ganze Abteilung angepasst'}${f.amount!=null?` · um ${f.amount} Punkte`:''}</div><div class="f-sub" style="font-style:italic">„${esc(f.sent)}“</div>`;
    } else if(f.kind==='dimAll'){
      tag = `<span class="chip ${f.dir>0?'green':'red'}">Alles ${f.dir>0?'+':'−'}</span>`;
      main = `<b>Gesamtes Profil: ${overallOf(p)} → ca. ${clamp(overallOf(p)+(f.amount!=null?f.amount:1)*f.dir,1,99)}</b><div class="f-sub">Alle Dimensionen und Unterpunkte ${f.dir>0?'angehoben':'gesenkt'}${f.amount!=null?` (um ${f.amount} Punkte)`:''}</div><div class="f-sub" style="font-style:italic">„${esc(f.sent)}“</div>`;
    } else if(f.kind==='setOverall'){
      tag = `<span class="chip navy">Gesamt</span>`;
      main = `<b>Gesamtwert: ${overallOf(p)} → ${f.value}</b><div class="f-sub">Alle Dimensionen werden gleichmäßig auf das Ziel gebracht</div><div class="f-sub" style="font-style:italic">„${esc(f.sent)}“</div>`;
    } else if(f.kind==='setDim'){
      const d=DIM_BY_KEY[f.dim];
      tag = `<span class="chip blue">${esc(d.label)}</span>`;
      main = `<b>${esc(d.label)}: ${dimAvg(p.dims[f.dim])} → ${f.value}</b><div class="f-sub">Ganze Abteilung auf Zielwert gesetzt</div><div class="f-sub" style="font-style:italic">„${esc(f.sent)}“</div>`;
    } else if(f.kind==='setMetric'){
      const d=DIM_BY_KEY[f.dim];
      tag = `<span class="chip blue">${esc(d.label)}</span>`;
      main = `<b>${esc(d.metrics[f.metric])}: ${p.dims[f.dim][f.metric]} → ${f.value}</b><div class="f-sub">Nur dieser Unterpunkt wird gesetzt</div><div class="f-sub" style="font-style:italic">„${esc(f.sent)}“</div>`;
    } else if(f.kind==='special'){
      tag = `<span class="chip purple">Fähigkeit</span>`;
      main = `<b>Besondere Fähigkeit</b><div class="f-sub">„${esc(f.text)}“</div>`;
    } else if(f.kind==='attr'){
      tag = `<span class="chip blue">${esc(f.label)}</span>`;
      main = `<b>${esc(f.label)}: ${esc(f.disp)}</b>`;
    } else {
      tag = `<span class="chip">Notiz</span>`;
      main = `<div class="f-sub">„${esc(f.text)}“ — wird in die Entwicklung übernommen</div>`;
    }
    return `<div class="finding ${f.on?'':'off'}">
      <button class="f-toggle" data-ftog="${i}">${svgI(I.check,12)}</button>
      <div class="f-main">${main}</div>
      <div class="f-tag">${tag}</div>
    </div>`;
  }).join('') + `
    <button class="btn btn-primary" id="pcApply" style="width:100%">${svgI(I.check,15)} Informationen übernehmen (${profileFindings.filter(f=>f.on).length})</button>`;
  $$('[data-ftog]', host).forEach(b=> b.onclick = ()=>{ const f=profileFindings[+b.dataset.ftog]; f.on=!f.on; renderProfileFindings(p); });
  $('#pcApply').onclick = ()=> applyProfileFindings(p);
}

function simulateDelta(p, f){
  const arr = p.dims[f.dim].slice();
  const only = f.metrics && f.metrics.length;
  arr.forEach((v,i)=>{
    if(only && !f.metrics.includes(i)) return;
    arr[i] = clamp(v + (f.amount!=null ? f.amount : (only?2:1))*f.dir, 1, 99);
  });
  return dimAvg(arr);
}

function applyProfileFindings(p){
  let applied = 0;
  profileFindings.filter(f=>f.on).forEach(f=>{
    const short = s => `„${s.slice(0,60)}${s.length>60?'…':''}“`;
    if(f.kind==='dim'){
      const r = applyDimDelta(p, f.dim, f.dir, f.metrics, f.amount);
      const scope = f.metrics && f.metrics.length ? DIM_BY_KEY[f.dim].metrics.filter((_,i)=>f.metrics.includes(i)).join(', ') : 'ganze Abteilung';
      logHist(p.id, `${DIM_BY_KEY[f.dim].label} (${scope}) ${f.dir>0?'verbessert':'gesenkt'}: ${r.before} → ${r.after} (${short(f.sent)})`, r.after-r.before);
      addNote(p, f.sent, profileInputSource, '', f.dir>0?1:-1, [DIM_BY_KEY[f.dim].label].filter(l=>IMPACT_TAGS.some(t=>t.key===l)));
      applied++;
    } else if(f.kind==='dimAll'){
      const r = applyAllDimsDelta(p, f.dir, f.amount);
      logHist(p.id, `Gesamtes Profil ${f.dir>0?'angehoben':'gesenkt'}: ${r.before} → ${r.after} (${short(f.sent)})`, r.after-r.before);
      addNote(p, f.sent, profileInputSource, '', f.dir, []);
      applied++;
    } else if(f.kind==='setOverall'){
      const r = setOverallTo(p, f.value);
      logHist(p.id, `Gesamtwert gesetzt: ${r.before} → ${r.after} (${short(f.sent)})`, r.after-r.before);
      addNote(p, f.sent, profileInputSource, '', r.after>r.before?1:r.after<r.before?-1:0, []);
      applied++;
    } else if(f.kind==='setDim'){
      const r = setDimTo(p, f.dim, f.value);
      logHist(p.id, `${DIM_BY_KEY[f.dim].label} gesetzt: ${r.before} → ${r.after} (${short(f.sent)})`, r.after-r.before);
      addNote(p, f.sent, profileInputSource, '', r.after>r.before?1:r.after<r.before?-1:0, [DIM_BY_KEY[f.dim].label].filter(l=>IMPACT_TAGS.some(t=>t.key===l)));
      applied++;
    } else if(f.kind==='setMetric'){
      const r = setMetricTo(p, f.dim, f.metric, f.value);
      logHist(p.id, `${DIM_BY_KEY[f.dim].label} · ${DIM_BY_KEY[f.dim].metrics[f.metric]} gesetzt: ${r.before} → ${r.after} (${short(f.sent)})`, r.after-r.before);
      addNote(p, f.sent, profileInputSource, '', r.after>r.before?1:r.after<r.before?-1:0, [DIM_BY_KEY[f.dim].label].filter(l=>IMPACT_TAGS.some(t=>t.key===l)));
      applied++;
    } else if(f.kind==='special'){
      p.specials.push({t:f.text, s:4}); logHist(p.id,'Besondere Fähigkeit ergänzt: '+f.text); applied++;
    } else if(f.kind==='attr'){
      p[f.field]=f.value; logHist(p.id, `${f.label} aktualisiert: ${f.disp}`); applied++;
    } else if(f.kind==='note'){
      logHist(p.id, 'Notiz: '+f.text);
      addNote(p, f.text, profileInputSource);
      applied++;
    }
  });
  profileFindings = [];
  saveAll(); renderPlayerProfile(p.id);
  toast(applied? `${applied} Information${applied>1?'en':''} übernommen` : 'Nichts ausgewählt', applied?'check':'info');
}

/* ---------- Auto-Texte für den Feedbackbogen ---------- */
function autoFeedbackTexts(p){
  const sorted = DIMS.map(d=>({d, v:dimAvg(p.dims[d.key])})).sort((a,b)=>b.v-a.v);
  const best = sorted.slice(0,2), worst = sorted.slice(-2).reverse();
  const o = overallOf(p);
  if(!p.fb.strengths) p.fb.strengths = best.map(x=>`${x.d.label} (${x.v})`).join(', ') + (p.specials.length? ` · ${p.specials[0].t}`:'');
  if(!p.fb.weaknesses) p.fb.weaknesses = worst.map(x=>`${x.d.label} (${x.v})`).join(', ');
  if(!p.fb.recommendation) p.fb.recommendation = o>=81
    ? `Leistungsniveau halten und gezielt an ${worst[0].d.label} arbeiten. Verantwortung im Team weiter ausbauen.`
    : `Gezielte Einzelarbeit an ${worst[0].d.label} und ${worst[1].d.label}. Stärken (${best[0].d.label}) bewusst im Spiel einsetzen.`;
  if(!p.fb.summary) p.fb.summary = `${p.first} liegt aktuell bei ${o} („${ratingBand(o).label}“) in der Abteilung Allgemein. Auffälligste Stärke: ${best[0].d.label}. Größtes Entwicklungsfeld: ${worst[0].d.label}.`;
}

<script>
'use strict';
/* ============================================================
   TRAINING — Planung · Anwesenheit · Archiv · Druck
   ============================================================ */
const BLOCK_NAME_SUGGESTIONS = ['Warm-up','Übung 1','Hauptteil 1','Hauptteil 2','Spielform','Abschluss'];

/* ---------- Gespeicherte Trainingstitel & Schwerpunkte (Vorlagen) ---------- */
function sortedTitleTemplates(){
  /* Nach Nutzungshäufigkeit, dann alphabetisch */
  return (S.titleTemplates||[]).slice().sort((a,b)=> (b.n||0)-(a.n||0) || a.t.localeCompare(b.t,'de'));
}
function rememberTitle(title){
  const t = (title||'').trim(); if(!t) return;
  S.titleTemplates = S.titleTemplates||[];
  const ex = S.titleTemplates.find(x=> lc(x.t)===lc(t)); /* keine Duplikate */
  if(ex){ ex.n = (ex.n||0)+1; ex.t = t; }
  else S.titleTemplates.push({ t, n:1 });
}
function focusOptions(current){
  const list = (S.focusList||[]).slice();
  if(current && !list.includes(current)) list.unshift(current); /* gelöschter Schwerpunkt macht bestehende Trainings nicht kaputt */
  return list.map(f=>`<option ${f===current?'selected':''}>${esc(f)}</option>`).join('');
}
function manageTitlesModal(afterClose){
  const paint = ov => {
    $('#mngList', ov).innerHTML = sortedTitleTemplates().map((x,i)=>`
      <div class="mng-row">
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(x.t)}</span>
        <span class="mn-count">${x.n||0}× genutzt</span>
        <button class="icon-btn" data-mngdel="${esc(x.t)}">${svgI(I.trash,14)}</button>
      </div>`).join('') || '<p class="tiny" style="padding:8px 0">Noch keine gespeicherten Titel. Beim Speichern eines Trainings wird der Titel automatisch aufgenommen.</p>';
    $$('[data-mngdel]', ov).forEach(b=> b.onclick = ()=>{
      S.titleTemplates = S.titleTemplates.filter(x=>x.t!==b.dataset.mngdel);
      saveAll(); paint(ov); toast('Titel gelöscht');
    });
  };
  const ov = openModal(`
    <div class="modal-head"><h2>Gespeicherte Trainingstitel</h2><button class="icon-btn" data-close>${svgI(I.x,16)}</button></div>
    <div class="modal-body">
      <div id="mngList"></div>
      <div style="display:flex;gap:7px;margin-top:12px">
        <input class="input" id="mngNew" placeholder="Neuen Titel hinzufügen …" style="flex:1">
        <button class="btn btn-soft" id="mngAdd">${svgI(I.plus,14)}</button>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" data-close>Fertig</button></div>`, 480);
  paint(ov);
  $('#mngAdd', ov).onclick = ()=>{
    const v = $('#mngNew', ov).value.trim(); if(!v) return;
    if(S.titleTemplates.some(x=>lc(x.t)===lc(v))){ toast('Titel existiert bereits','info'); return; }
    S.titleTemplates.push({t:v, n:0}); saveAll(); $('#mngNew', ov).value=''; paint(ov); toast('Titel gespeichert');
  };
  ov.addEventListener('click', e=>{ if(e.target===ov && afterClose) afterClose(); });
  $$('[data-close]', ov).forEach(b=>{ const orig=b.onclick; b.onclick=()=>{ closeModal(); afterClose&&afterClose(); }; });
}
function manageFocusesModal(afterClose){
  const paint = ov => {
    $('#mngList', ov).innerHTML = (S.focusList||[]).map(f=>`
      <div class="mng-row">
        <span style="flex:1">${esc(f)}</span>
        ${FOCUS_TOPICS[f]?'<span class="mn-count">mit Trainer-Hinweisen</span>':''}
        <button class="icon-btn" data-mngdel="${esc(f)}" ${(S.focusList||[]).length<=1?'disabled style="opacity:.3"':''}>${svgI(I.trash,14)}</button>
      </div>`).join('') || '<p class="tiny" style="padding:8px 0">Keine Schwerpunkte vorhanden.</p>';
    $$('[data-mngdel]', ov).forEach(b=> b.onclick = ()=>{
      if((S.focusList||[]).length<=1) return;
      S.focusList = S.focusList.filter(x=>x!==b.dataset.mngdel);
      saveAll(); paint(ov); toast('Schwerpunkt gelöscht — bestehende Trainings bleiben unverändert');
    });
  };
  const ov = openModal(`
    <div class="modal-head"><h2>Schwerpunkte verwalten</h2><button class="icon-btn" data-close>${svgI(I.x,16)}</button></div>
    <div class="modal-body">
      <p class="tiny" style="margin-bottom:10px">Gelöschte Schwerpunkte bleiben in bereits gespeicherten Trainings erhalten und machen nichts kaputt.</p>
      <div id="mngList"></div>
      <div style="display:flex;gap:7px;margin-top:12px">
        <input class="input" id="mngNew" placeholder="Neuen Schwerpunkt hinzufügen …" style="flex:1">
        <button class="btn btn-soft" id="mngAdd">${svgI(I.plus,14)}</button>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" data-close>Fertig</button></div>`, 480);
  paint(ov);
  $('#mngAdd', ov).onclick = ()=>{
    const v = $('#mngNew', ov).value.trim(); if(!v) return;
    if((S.focusList||[]).some(x=>lc(x)===lc(v))){ toast('Schwerpunkt existiert bereits','info'); return; }
    S.focusList.push(v); saveAll(); $('#mngNew', ov).value=''; paint(ov); toast('Schwerpunkt hinzugefügt');
  };
  $$('[data-close]', ov).forEach(b=>{ b.onclick=()=>{ closeModal(); afterClose&&afterClose(); }; });
}

function newTrainingDraft(){
  return {
    id:null, title:'', date:todayISO(), time:'17:30', duration:90, focus:'Allgemein',
    blocks:[ newBlock('Warm-up') ],
    attendance: Object.fromEntries(S.players.map(p=>[p.id, p.status==='fit'])),
    showHints:true
  };
}
function newBlock(name){
  return { id:uid(), name:name||'Übung', title:'', duration:15, description:'', coaching:'', organisation:'', material:'', notes:'' };
}
function startNewTrainingDraft(withHints){
  S.trainingDraft = newTrainingDraft();
  S.trainingDraft.showHints = !!withHints;
  saveAll();
  go('training',{trainTab:'plan'});
  if(withHints) toast('Trainingsplanung geöffnet — du planst selbst, unten findest du Hinweise zum Schwerpunkt','bulb');
}
function openTrainingForEdit(id){
  const t = S.trainings.find(x=>x.id===id); if(!t) return;
  S.trainingDraft = JSON.parse(JSON.stringify({ ...t, showHints:false }));
  saveAll();
  go('training',{trainTab:'plan'});
}

function renderTraining(){
  const tabs = `
    <div class="tabs">
      <button class="tab ${route.trainTab==='plan'?'active':''}" data-ttab="plan">Planung</button>
      <button class="tab ${route.trainTab==='archive'?'active':''}" data-ttab="archive">Archiv</button>
    </div>`;
  if(route.trainTab==='archive'){ renderTrainingArchive(tabs); }
  else { renderTrainingPlanner(tabs); }
  $$('[data-ttab]').forEach(b=> b.onclick = ()=>{ route.trainTab=b.dataset.ttab; render(); });
}

/* ---------- Trainingsplanung ---------- */
function renderTrainingPlanner(tabs){

  const d = S.trainingDraft;
  const sumBlocks = d.blocks.reduce((s,b)=>s+(+b.duration||0),0);

  `);

                <datalist id="titleTemplatesList">${sortedTitleTemplates().map(x=>`<option value="${esc(x.t)}">`).join('')}</datalist>
              </div>
              <div class="field">
                <label style="display:flex;align-items:center;gap:8px">Schwerpunkt <button class="btn btn-xs btn-ghost" id="tFocusManage" title="Schwerpunkte verwalten" style="margin-left:auto">${svgI(I.edit,11)} Verwalten</button></label>
                <select class="select" id="tFocus">${focusOptions(d.focus)}</select>
              </div>
              <div class="field"><label>Datum</label><input class="input" id="tDate" type="date" value="${esc(d.date)}"></div>
              <div class="field"><label>Uhrzeit</label><input class="input" id="tTime" type="time" value="${esc(d.time)}"></div>
              <div class="field"><label>Gesamtdauer (Min)</label><input class="input" id="tDur" type="number" min="15" step="5" value="${d.duration}"></div>
              <div class="field half" style="justify-content:flex-end">

              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3>Trainingsblöcke</h3>

          </div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:12px">
            ${d.blocks.length? d.blocks.map((b,i)=>`
              <div class="block-card">
                <div class="block-head">
                  <span class="b-idx">${i+1}</span>
                  <input class="b-name" data-bf="${i}|name" value="${esc(b.name)}" placeholder="Blockname (z. B. Hauptteil 1)">
                  <span class="block-dur">${svgI(I.clock,13)} <input type="number" min="1" data-bf="${i}|duration" value="${b.duration}"> Min</span>
                  <span style="display:flex;gap:2px">

                    <button class="icon-btn" data-bmove="${i}|1" title="nach unten" ${i===d.blocks.length-1?'disabled style="opacity:.3"':''}>${svgI(I.down,15)}</button>
                    <button class="icon-btn" data-bdel="${i}" title="löschen">${svgI(I.trash,15)}</button>
                  </span>
                </div>
                <div class="block-body">
                  <div class="field full"><label>Titel der Übung</label><input class="input" data-bf="${i}|title" value="${esc(b.title)}" placeholder="z. B. Rondo 5 gegen 2"></div>

        <div class="hint-box">

          <ul id="hintList">${(FOCUS_TOPICS[d.focus]||FOCUS_TOPICS['Allgemein']).map(h=>`<li>${h}</li>`).join('')}</ul>
          <p class="tiny" style="margin-top:9px;color:#3d6355">Du planst die Einheit selbst — diese Punkte sind nur Orientierung.</p>

  };
  $('#tTitleManage').onclick = ()=> manageTitlesModal(()=>renderTraining());
  $('#tFocusManage').onclick = ()=> manageFocusesModal(()=>renderTraining());
  $('#tAddBlock').onclick = ()=>{

  };
  $$('[data-bf]').forEach(el=> el.addEventListener('input', ()=>{

    d.blocks[+i][f] = f==='duration' ? (parseInt(el.value)||0) : el.value;
    saveAll();
  }));
  $$('[data-bmove]').forEach(b=> b.onclick = ()=>{
    const [i,dir] = b.dataset.bmove.split('|').map(Number);
    const j=i+dir; if(j<0||j>=d.blocks.length) return;
    [d.blocks[i],d.blocks[j]]=[d.blocks[j],d.blocks[i]];
    saveAll(); renderTraining();
  });
  $$('[data-bdel]').forEach(b=> b.onclick = ()=>{
    const i=+b.dataset.bdel;
    confirmDlg('Übung löschen', `„${d.blocks[i].name}${d.blocks[i].title?' — '+d.blocks[i].title:''}“ wird entfernt.`, 'Löschen', ()=>{
      d.blocks.splice(i,1); saveAll(); renderTraining();

  });
  $$('[data-att]').forEach(el=>{

        d.attendance[pid]=!d.attendance[pid]; saveAll(); renderTraining();
      },220);

    el.addEventListener('dblclick', ()=>{ clearTimeout(clickTimer); openPlayer(el.dataset.att); });

}

function confirmOrNew(){
  const d=S.trainingDraft;
  const dirty = d && (d.title || d.blocks.some(b=>b.title||b.description));
  if(dirty && !d.id){
    confirmDlg('Neue Einheit beginnen','Der aktuelle, nicht gespeicherte Entwurf wird verworfen.','Neu beginnen',()=>startNewTrainingDraft(false));
  } else startNewTrainingDraft(false);
}

function collectDraft(){ return S.trainingDraft; }

function saveTrainingDraft(){
  const d = S.trainingDraft;
  if(!d.title.trim()){ toast('Bitte einen Trainingstitel eingeben','info'); $('#tTitle')&&$('#tTitle').focus(); return; }
  const rec = { id:d.id||uid(), title:d.title.trim(), date:d.date, time:d.time, duration:d.duration, focus:d.focus,
                blocks:JSON.parse(JSON.stringify(d.blocks)), attendance:{...d.attendance}, savedAt:new Date().toISOString() };
  const ix = S.trainings.findIndex(t=>t.id===rec.id);
  if(ix>=0) S.trainings[ix]=rec; else S.trainings.push(rec);
  rememberTitle(rec.title); /* Titel automatisch als Vorlage speichern (ohne Duplikate) */
  if(rec.focus && !(S.focusList||[]).includes(rec.focus)) S.focusList.push(rec.focus);
  S.trainingDraft = null;
  saveAll();
  route.trainTab='archive'; render();
  toast(ix>=0?'Training aktualisiert':'Training gespeichert und ins Archiv übernommen');
}

/* ---------- Trainingsarchiv ---------- */
let trainSearch='', trainFrom='', trainTo='';
function renderTrainingArchive(tabs){
  setTopbar('Training', `${S.trainings.length} Einheiten im Archiv`, `
    <button class="btn btn-accent" id="trNew2">${svgI(I.plus,15)} Neue Einheit</button>
  `);
  const list = S.trainings.slice()
    .filter(t=>{
      const q=lc(trainSearch);
      if(q && !(lc(t.title).includes(q) || lc(t.focus||'').includes(q) || t.blocks.some(b=>lc(b.title).includes(q)||lc(b.name).includes(q)))) return false;
      if(trainFrom && t.date<trainFrom) return false;
      if(trainTo && t.date>trainTo) return false;
      return true;
    })
    .sort((a,b)=>b.date.localeCompare(a.date));

  $('#view').innerHTML = `
    <div style="margin-bottom:18px">${tabs}</div>
    <div class="card" style="margin-bottom:16px"><div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="search-wrap">${svgI(I.search,15)}<input class="input" id="taSearch" placeholder="Titel, Schwerpunkt oder Übung suchen …" value="${esc(trainSearch)}"></div>
      <div class="field" style="width:150px"><label>Von</label><input class="input" id="taFrom" type="date" value="${esc(trainFrom)}"></div>
      <div class="field" style="width:150px"><label>Bis</label><input class="input" id="taTo" type="date" value="${esc(trainTo)}"></div>
      ${(trainSearch||trainFrom||trainTo)?`<button class="btn btn-ghost btn-sm" id="taReset">Zurücksetzen</button>`:''}
    </div></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${list.length? list.map(t=>{ const ds=fmtDShort(t.date); const present=Object.values(t.attendance||{}).filter(Boolean).length; return `
        <div class="arch-item">
          <div class="arch-date"><b>${ds.d}</b><span>${ds.m}</span></div>
          <div class="arch-main">
            <div class="a-title">${esc(t.title)}</div>
            <div class="a-sub">${esc(t.time||'')} Uhr · ${t.duration} Min · ${t.blocks.length} Blöcke · ${present} anwesend${t.focus?` · <span class="chip" style="font-size:10.5px;padding:1px 7px">${esc(t.focus)}</span>`:''}</div>
          </div>
          <div class="arch-actions">
            <button class="btn btn-sm btn-ghost" data-topen="${t.id}">${svgI(I.eye,14)} Öffnen</button>
            <button class="btn btn-sm btn-ghost" data-tprint="${t.id}">${svgI(I.print,14)}</button>
            <button class="icon-btn" data-tdel="${t.id}">${svgI(I.trash,15)}</button>
          </div>
        </div>`; }).join('') : `<div class="card card-pad" style="text-align:center"><p class="muted">Keine Einheiten gefunden.</p></div>`}
    </div>`;

  $('#trNew2').onclick = ()=> startNewTrainingDraft(false);
  $('#taSearch').oninput = e=>{ trainSearch=e.target.value; renderTraining(); };
  $('#taFrom').onchange = e=>{ trainFrom=e.target.value; renderTraining(); };
  $('#taTo').onchange = e=>{ trainTo=e.target.value; renderTraining(); };
  if($('#taReset')) $('#taReset').onclick = ()=>{ trainSearch=trainFrom=trainTo=''; renderTraining(); };
  $$('[data-topen]').forEach(b=> b.onclick = ()=> openTrainingForEdit(b.dataset.topen));
  $$('[data-tprint]').forEach(b=> b.onclick = ()=>{ const t=S.trainings.find(x=>x.id===b.dataset.tprint); if(t) showTrainingPrintOptions(t); });
  $$('[data-tdel]').forEach(b=> b.onclick = ()=>{
    const t=S.trainings.find(x=>x.id===b.dataset.tdel);
    confirmDlg('Training löschen', `„${t.title}“ wird dauerhaft aus dem Archiv entfernt.`, 'Löschen', ()=>{
      S.trainings=S.trainings.filter(x=>x.id!==t.id); saveAll(); renderTraining(); toast('Training gelöscht');
    });
  });
}

/* ---------- Druck: Trainingseinheit (DIN A4, s/w) ---------- */
/* Vor dem Druck wählt der Trainer, wie die Skizzenseite aussehen soll —
   sie füllt in jedem Fall eine eigene DIN-A4-Seite. */
function showTrainingPrintOptions(t){
  if(!t) return;
  const ov = openModal(`
    <div class="modal-head"><h2>Training drucken</h2><button class="icon-btn" data-close>${svgI(I.x,16)}</button></div>
    <div class="modal-body">
      <p class="tiny" style="margin-bottom:12px">Die Skizzenseite wird immer als <b>eigene DIN-A4-Seite</b> gedruckt. Wähle, wie der Bereich unter dem Spielfeld aussehen soll:</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${[['blanko','Vollständig blanko','Spielfeld oben, freier Platz zum Skizzieren darunter'],
           ['raster','Feines Raster','Spielfeld oben, 5-mm-Raster für saubere Skizzen darunter'],
           ['linien','Notizlinien','Spielfeld oben, linierte Notizfläche darunter']].map(([v,l,s],i)=>`
          <label style="display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer">

    const mode = ($('input[name="sketchMode"]:checked', ov)||{}).value || 'blanko';

  };
}
function printTraining(t, sketchMode='blanko'){
  if(!t){ return; }

    : sketchMode==='linien' ? `<div class="sketch-lines">${'<div class="sl"></div>'.repeat(13)}</div>`
    : '<div class="sketch-blank"></div>';
  const present = S.players.filter(p=> (t.attendance||{})[p.id]).sort((a,b)=>a.num-b.num);
  const sumBlocks = t.blocks.reduce((s,b)=>s+(+b.duration||0),0);
  printSheet(`
  <div class="pr-doc">
    <div class="pr-head">
      <div>
        <div class="pr-brand">${esc(S.clubName)} · ${esc(S.teamName)} · Trainingseinheit</div>

      </div>
      <div class="pr-meta">
        <b>${fmtDLong(t.date)}</b><br>
        ${esc(t.time||'')} Uhr · ${t.duration} Min geplant<br>
        Schwerpunkt: ${esc(t.focus||'—')}
      </div>
    </div>

    <div class="pr-sec">
      <h2>Trainingsstruktur (${t.blocks.length} Blöcke · ${sumBlocks} Min)</h2>
      ${t.blocks.map((b,i)=>`
        <div class="pr-block">
          <div class="pr-block-head"><span>${i+1}. ${esc(b.name)}${b.title?` — ${esc(b.title)}`:''}</span><span>${b.duration} Min</span></div>
          <div class="pr-block-body">
            ${b.description?`<div class="full"><b>Beschreibung:</b> ${esc(b.description)}</div>`:''}
            ${b.coaching?`<div><b>Coachingpunkte:</b> ${esc(b.coaching)}</div>`:''}
            ${b.organisation?`<div><b>Organisation:</b> ${esc(b.organisation)}</div>`:''}
            ${b.material?`<div><b>Material:</b> ${esc(b.material)}</div>`:''}
            ${b.notes?`<div><b>Notizen:</b> ${esc(b.notes)}</div>`:''}
          </div>
        </div>`).join('')}
    </div>

    <div class="pr-sec">
      <h2>Anwesende Spieler (${present.length})</h2>
      <div class="pr-names">
        ${present.map(p=>`<span>#${p.num} ${esc(p.name)}</span>`).join('') || '<span>—</span>'}
      </div>
    </div>

    <div class="pr-sec pr-sketch-page">
      <h2>Skizzenfeld — ${esc(t.title||'Trainingseinheit')} · ${fmtD(t.date)}</h2>
      <div class="pr-pitch">${pitchSketchSVG()}</div>
      ${sketchExtra}
      <div class="pr-note">Skizzenseite zum Einzeichnen von Übungsformen, Laufwegen und Organisation — füllt bewusst eine komplette DIN-A4-Seite.</div>
    </div>
  </div>`);
}

<script>
'use strict';
/* ============================================================
   SPIEL — Aufstellung · Datenerfassung · Archiv · Druck

const FORMATION_SLOTS = [
  {pos:'TW',x:50,y:91},{pos:'LV',x:18,y:74},{pos:'IV',x:38,y:78},{pos:'IV',x:62,y:78},{pos:'RV',x:82,y:74},
  {pos:'DM',x:50,y:62},{pos:'ZM',x:33,y:50},{pos:'ZM',x:67,y:50},{pos:'LA',x:16,y:32},{pos:'RA',x:84,y:32},{pos:'ST',x:50,y:20}
];
const POS_FALLBACK = {TW:['TW'],LV:['LV','IV','RV','DM'],IV:['IV','DM','RV','LV'],RV:['RV','IV','LV','DM'],DM:['DM','ZM','IV'],ZM:['ZM','DM','OM'],OM:['OM','ZM','ST'],LA:['LA','RA','OM','ST'],RA:['RA','LA','OM','ST'],ST:['ST','OM','LA','RA']};
const POSWORD = {'torwart':'TW','keeper':'TW','innenverteidiger':'IV','linksverteidiger':'LV','rechtsverteidiger':'RV','außenverteidiger':'RV','sechser':'DM','defensives mittelfeld':'DM','zentrales mittelfeld':'ZM','achter':'ZM','zehner':'OM','offensives mittelfeld':'OM','linksaußen':'LA','rechtsaußen':'RA','flügel':'LA','mittelstürmer':'ST','stürmer':'ST','sturm':'ST'};

function newMatchDraft(){
  const fit = S.players.filter(p=>p.status!=='verletzt' && p.status!=='krank');
  /* Positionsgetreue Startelf: je Slot passender Spieler, sonst nächstliegende Position */
  const used = new Set();
  const field = [];
  FORMATION_SLOTS.forEach(sl=>{
    let cand = null;
    for(const fp of (POS_FALLBACK[sl.pos]||[sl.pos])){
      const pool = fit.filter(p=>!used.has(p.id) && p.pos===fp).sort((a,b)=>overallOf(b)-overallOf(a));
      if(pool.length){ cand = pool[0]; break; }
    }
    if(!cand) cand = fit.filter(p=>!used.has(p.id)).sort((a,b)=>overallOf(b)-overallOf(a))[0];
    if(cand){ used.add(cand.id); field.push({ pid:cand.id, x:sl.x, y:sl.y }); }
  });
  const fieldIds = new Set(field.map(f=>f.pid));
  const d = {
    id:null, opponent:'', date:todayISO(), time:'11:00', matchType:'Ligaspiel', competition:'', venue:'Heim',
    meeting:'', address:'',
    goalsFor:null, goalsAgainst:null, totalMinutes:80, targetMinutes:80, teamNotes:'', conclusion:'',
    lineup:{
      field,
      bench: S.players.filter(p=>!fieldIds.has(p.id) && p.status!=='verletzt' && p.status!=='krank').map(p=>p.id),
      out: S.players.filter(p=>!fieldIds.has(p.id) && (p.status==='verletzt'||p.status==='krank')).map(p=>p.id)
    },
    matchPlan: emptyMatchPlan(),
    setPieces: emptySetPieces(),
    generalStandards:'', standardNames: emptyStandardNames(),
    playerData:{}, applied:{}
  };
  S.players.forEach(p=> ensurePD(d, p.id));
  return d;
}
function ensurePD(d, pid){
  if(!d.playerData[pid]){
    const p = S.players.find(x=>x.id===pid);
    d.playerData[pid] = { from:null, to:null, position:p?p.pos:'', impact:null, tags:[], note:'', events:[] };
  }
  if(!Array.isArray(d.playerData[pid].tags)) d.playerData[pid].tags = [];
  return d.playerData[pid];
}
function pdMinutes(pd){ return (pd.from!=null && pd.to!=null && pd.to>=pd.from) ? pd.to-pd.from : null; }

/* ============================================================
   Match-Auswertung → Spielerprofile (intelligent gewichtet)
   Sanfte Anpassung statt Überschreiben; jede Änderung wird mit
   Quelle (Spiel/Gegner) und Begründung in der Historie dokumentiert.
   ============================================================ */
function nudgeMetric(p, dimKey, metricLabel, delta, reason, opp){
  const d = DIM_BY_KEY[dimKey]; if(!d || !delta) return false;
  let mi = d.metrics.findIndex(m=> lc(m)===lc(metricLabel));
  if(mi===-1) mi = d.metrics.findIndex(m=> lc(m).includes(lc(metricLabel).split(' ')[0]));
  if(mi===-1) return false;
  const arr = p.dims[dimKey]; if(!Array.isArray(arr) || arr[mi]===undefined) return false;
  const before = arr[mi];
  arr[mi] = clamp(arr[mi] + delta, 1, 99);
  if(arr[mi]!==before){
    logHist(p.id, `${d.label} · ${d.metrics[mi]}: ${before} → ${arr[mi]} (Spiel${opp?' vs. '+opp:''} — ${reason})`, arr[mi]-before);
    return true;
  }
  return false;
}
function nudgeDim(p, dimKey, delta, reason, opp){
  const d = DIM_BY_KEY[dimKey]; if(!d || !delta) return false;
  const arr = p.dims[dimKey]; if(!Array.isArray(arr)) return false;
  const before = dimAvg(arr);
  arr.forEach((v,i)=>{ arr[i] = clamp(v + delta, 1, 99); });
  const after = dimAvg(arr);
  if(after!==before){
    logHist(p.id, `${d.label}: ${before} → ${after} (Spiel${opp?' vs. '+opp:''} — ${reason})`, after-before);
    return true;
  }
  return false;
}
function reportSignature(pd, m){
  return JSON.stringify([pd.impact, pd.tags, pd.events, pd.from, pd.to, pd.note]);
}
function applyMatchReportsToProfiles(m){
  m.applied = m.applied || {};
  let adjustedPlayers = 0;
  const total = m.totalMinutes || 80;
  Object.entries(m.playerData||{}).forEach(([pid, pd])=>{
    const p = S.players.find(x=>x.id===pid); if(!p) return;
    const sig = reportSignature(pd, m);
    if(m.applied[pid]===sig) return; /* unverändert → nicht doppelt anwenden */
    const hasReport = pd.impact!=null || (pd.events||[]).length || (pd.note||'').trim();
    if(!hasReport){ m.applied[pid]=sig; return; }
    let changed = false;
    const imp = pd.impact;
    /* Quelle immer mit Gegner UND Datum dokumentieren */
    const opp = (m.opponent||'') + (m.date ? (m.opponent?', ':'') + fmtD(m.date) : '');

    /* 1) Impact + Tags → passende Dimensionen, sanft gewichtet (±1, bei ±3 → ±2) */
    if(imp!=null && imp!==0 && (pd.tags||[]).length){
      const delta = imp>0 ? (imp>=3?2:1) : (imp<=-3?-2:-1);
      pd.tags.forEach(tag=>{
        const def = IMPACT_TAGS.find(t=>t.key===tag); if(!def || !DIM_BY_KEY[def.dim]) return;
        if(nudgeDim(p, def.dim, delta, `Impact ${fmtImpact(imp)}, Tag ${tag}`, opp)) changed = true;
      });
    }

    /* 2) Tore/Vorlagen → nur passende Bereiche (Abschluss, Entscheidungsqualität, Passspiel/Übersicht) */
    const goals = (pd.events||[]).filter(e=>lc(e)==='tor').length;
    const assists = (pd.events||[]).filter(e=>lc(e)==='assist'||lc(e)==='vorlage').length;
    if(goals>0){
      const delta = Math.min(goals,2);
      if(nudgeMetric(p,'technik','Abschluss / Beidfüßigkeit', delta, `${goals} Tor${goals>1?'e':''}`, opp)) changed = true;
      if(nudgeMetric(p,'spielintelligenz','Entscheidungsqualität', 1, `${goals} Tor${goals>1?'e':''} — Offensivwirkung`, opp)) changed = true;
    }
    if(assists>0){
      if(nudgeMetric(p,'technik','Passspiel kurz & lang', 1, `${assists} Vorlage${assists>1?'n':''}`, opp)) changed = true;
      if(nudgeMetric(p,'spielintelligenz','Übersicht', 1, `${assists} Vorlage${assists>1?'n':''}`, opp)) changed = true;
    }

    /* 3) Karten → Verhalten/Disziplin */
    (pd.events||[]).forEach(e=>{
      const t = lc(e);
      if(t.includes('gelb-rot') || t.includes('rote karte') || t==='rot'){
        if(nudgeMetric(p,'verhalten','Disziplin', -2, 'Platzverweis', opp)) changed = true;
        if(nudgeMetric(p,'verhalten','Teamgeist', -1, 'Platzverweis — Team geschwächt', opp)) changed = true;
      } else if(t.includes('gelb')){
        if(nudgeMetric(p,'verhalten','Disziplin', -1, 'Gelbe Karte', opp)) changed = true;
      }
    });

    /* 4) Lange Einsatzzeit + positiver Impact → Belastbarkeit/Verlässlichkeit */
    const mins = pdMinutes(pd);
    if(mins!=null && total>0 && mins/total>=0.75 && imp!=null && imp>=1){
      if(nudgeMetric(p,'athletik','Ausdauer', 1, `${mins} Minuten mit Impact ${fmtImpact(imp)}`, opp)) changed = true;
      if(nudgeMetric(p,'mentalitaet','Konzentration', 1, `volle Distanz verlässlich (${mins} Min)`, opp)) changed = true;
    }

    /* 5) Verletzung → Status */
    if((pd.events||[]).some(e=>lc(e)==='verletzung') && p.status==='fit'){
      p.status='angeschlagen';
      logHist(p.id, `Status auf „angeschlagen“ gesetzt (Verletzung im Spiel${opp?' vs. '+opp:''})`);
      changed = true;
    }

    /* 6) Notiz + Bewertung dauerhaft beim Spieler speichern (Quelle: Spiel) */
    if((pd.note||'').trim() || imp!=null){
      addNote(p, (pd.note||'').trim() || `Spielbewertung: Impact ${fmtImpact(imp)}`, 'Spiel', opp, imp, (pd.tags||[]).slice(), (m.date? m.date+'T12:00:00.000Z' : undefined));
    }
    if(imp!=null && !changed){
      logHist(p.id, `Spielbewertung vs. ${opp||'—'}: Impact ${fmtImpact(imp)}${(pd.tags||[]).length?' ('+pd.tags.join(', ')+')':''}`, 0);
    }
    m.applied[pid] = sig;
    if(changed || imp!=null) adjustedPlayers++;
  });
  return adjustedPlayers;
}

/* ---------- Aufstellungs-Drag&Drop mit direktem Spielertausch ----------
   · Spieler auf Spieler ziehen (Feld) = tauschen: der Feldspieler übernimmt
     Bank/„Nicht im Kader“-Platz des gezogenen Spielers bzw. dessen Feldposition.
   · Ziehen auf freie Feldfläche = freie Positionierung (wie bisher).
   · Ziehen auf Bank/Nicht im Kader = dorthin verschieben. */
function zoneOfPlayer(d, pid){
  if(d.lineup.field.some(f=>f.pid===pid)) return 'field';
  if(d.lineup.bench.includes(pid)) return 'bench';
  if(d.lineup.out.includes(pid)) return 'out';
  return null;
}
function initLineupDrag(d){
  $$('[data-drag-pid]').forEach(el=>{
    el.addEventListener('pointerdown', ev=>{
      if(ev.button!==0 && ev.pointerType==='mouse') return;
      const pid = el.dataset.dragPid;
      const startX=ev.clientX, startY=ev.clientY;
      let dragging=false, ghost=null;
      const clearHots = ()=>{
        $$('[data-zone]').forEach(z=>z.classList.remove('drop-hot'));
        $$('.swap-hot').forEach(z=>z.classList.remove('swap-hot'));
      };
      const onMove = e=>{
        if(!dragging && Math.hypot(e.clientX-startX, e.clientY-startY) > 7){
          dragging=true;
          el.classList.add('dragging');
          ghost = el.cloneNode(true);
          ghost.classList.add('drag-ghost');
          ghost.style.position='fixed'; ghost.style.left='0'; ghost.style.top='0'; ghost.style.margin='0'; ghost.style.width=el.offsetWidth+'px';
          document.body.appendChild(ghost);
        }
        if(dragging){
          ghost.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
          clearHots();
          const tgt = dragTargetAt(e.clientX, e.clientY, ghost, pid);
          if(tgt.playerEl) tgt.playerEl.classList.add('swap-hot');   /* Tausch-Ziel hervorheben */
          else if(tgt.zone) tgt.zone.classList.add('drop-hot');      /* Zonen-Ziel hervorheben */
        }
      };
      const onUp = e=>{
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        el.classList.remove('dragging');
        clearHots();
        if(ghost) ghost.remove();
        if(!dragging) return;
        const tgt = dragTargetAt(e.clientX, e.clientY, null, pid);
        if(tgt.playerEl){
          swapPlayers(d, pid, tgt.playerEl.dataset.dragPid);
        } else if(tgt.zone){
          movePlayerTo(d, pid, tgt.zone.dataset.zone, tgt.zone, e.clientX, e.clientY);
        }
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}
function dragTargetAt(x, y, ghost, dragPid){
  if(ghost) ghost.style.display='none';
  const el = document.elementFromPoint(x, y);
  if(ghost) ghost.style.display='';
  if(!el) return { zone:null, playerEl:null };
  const playerEl = el.closest('[data-drag-pid]');
  if(playerEl && playerEl.dataset.dragPid !== dragPid) return { zone:null, playerEl };
  return { zone: el.closest('[data-zone]'), playerEl:null };
}
function swapPlayers(d, pidA, pidB){
  const zoneA = zoneOfPlayer(d, pidA), zoneB = zoneOfPlayer(d, pidB);
  if(!zoneA || !zoneB || pidA===pidB) return;
  const fa = d.lineup.field.find(f=>f.pid===pidA);
  const fb = d.lineup.field.find(f=>f.pid===pidB);
  if(zoneA==='field' && zoneB==='field'){
    /* Feld ↔ Feld: exakte Positionen tauschen */
    const ax=fa.x, ay=fa.y; fa.x=fb.x; fa.y=fb.y; fb.x=ax; fb.y=ay;
  } else if(zoneB==='field'){
    /* Bank/Nicht-im-Kader → Feldspieler: neuer Spieler exakt auf die Feldposition,
       der bisherige Feldspieler wandert automatisch in die Herkunftszone zurück */
    const pos = { x:fb.x, y:fb.y };
    d.lineup.field = d.lineup.field.filter(f=>f.pid!==pidB);
    if(zoneA==='bench') d.lineup.bench = d.lineup.bench.map(x=> x===pidA ? pidB : x);
    else d.lineup.out = d.lineup.out.map(x=> x===pidA ? pidB : x);
    d.lineup.field.push({ pid:pidA, x:pos.x, y:pos.y });
  } else if(zoneA==='field'){
    /* Feldspieler auf Bank-/Nicht-im-Kader-Spieler gezogen: ebenfalls tauschen */
    const pos = { x:fa.x, y:fa.y };
    d.lineup.field = d.lineup.field.filter(f=>f.pid!==pidA);
    if(zoneB==='bench') d.lineup.bench = d.lineup.bench.map(x=> x===pidB ? pidA : x);
    else d.lineup.out = d.lineup.out.map(x=> x===pidB ? pidA : x);
    d.lineup.field.push({ pid:pidB, x:pos.x, y:pos.y });
  } else {
    /* Bank ↔ Nicht im Kader (oder gleiche Zone): Plätze tauschen */
    const ia = d.lineup[zoneA].indexOf(pidA), ib = d.lineup[zoneB].indexOf(pidB);
    if(zoneA===zoneB){ const arr=d.lineup[zoneA]; [arr[ia],arr[ib]]=[arr[ib],arr[ia]]; }
    else { d.lineup[zoneA][ia]=pidB; d.lineup[zoneB][ib]=pidA; }
  }
  const A = S.players.find(p=>p.id===pidA), B = S.players.find(p=>p.id===pidB);
  saveAll(); renderSpiel();
  if(A&&B) toast(`${A.first} ↔ ${B.first} getauscht`,'swap');
}
function movePlayerTo(d, pid, zoneName, zoneEl, cx, cy){
  d.lineup.field = d.lineup.field.filter(f=>f.pid!==pid);
  d.lineup.bench = d.lineup.bench.filter(x=>x!==pid);
  d.lineup.out   = d.lineup.out.filter(x=>x!==pid);
  if(zoneName==='field'){
    const r = zoneEl.getBoundingClientRect();
    const x = clamp(Math.round((cx-r.left)/r.width*100), 4, 96);
    const y = clamp(Math.round((cy-r.top)/r.height*100), 4, 96);
    d.lineup.field.push({ pid, x, y });
  } else if(zoneName==='bench'){
    d.lineup.bench.push(pid);
  } else {
    d.lineup.out.push(pid);
  }
  saveAll(); renderSpiel();
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
  return Promise.resolve();
}
function nominatedPlayers(m){
  return [...m.lineup.field.map(f=>f.pid), ...m.lineup.bench]
    .map(pid=>S.players.find(p=>p.id===pid)).filter(Boolean)
    .sort((a,b)=>(a.num||99)-(b.num||99));
}
function buildWhatsAppText(m, tplText, zusatz){
  const kader = nominatedPlayers(m).map(p=>`• #${p.num} ${p.name}`).join('\n');
  return String(tplText||'')
    .split('{GEGNER}').join(m.opponent||'—')
    .split('{DATUM}').join(fmtDLong(m.date))
    .split('{ANSTOSS}').join(m.time||'—')
    .split('{TREFFPUNKT}').join(m.meeting||'—')
    .split('{ADRESSE}').join(m.address||'—')
    .split('{KADER}').join(kader||'—')
    .split('{ZUSATZ}').join((zusatz||'').trim() ? (zusatz.trim()+'\n\n') : '');
}

<script>
'use strict';
/* ============================================================
   KALENDER — Monatsansicht · Termine · Eltern-Monatsplan-Druck
   Trainings und Spiele erscheinen automatisch; manuelle Termine
   sind „öffentlich (Elternplan)“ oder „intern“ markierbar.
   ============================================================ */
function ymNow(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function ymShift(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function ymLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});
}
/* Alle Termine eines Tages: Trainings + Spiele (automatisch) + manuelle Termine */
function calDisplayEvents(iso){
  const evs = [];
  (S.trainings||[]).forEach(t=>{ if(t.date===iso) evs.push({
    kind:'training', id:t.id, time:t.time||'', title:t.title||'Training',
    sub:['Training', t.duration?t.duration+' Min':'', t.focus||''].filter(Boolean).join(' · '),
    public: t.calPublic!==false }); });
  (S.matches||[]).forEach(m=>{ if(m.date===iso) evs.push({
    kind:'match', id:m.id, time:m.time||'', title:'Spiel vs. '+(m.opponent||'?'),
    sub:[(m.matchType||'Spiel'), m.venue||'', m.meeting?'Treffpunkt '+m.meeting:''].filter(Boolean).join(' · '),
    public: m.calPublic!==false }); });
  (S.calendarEvents||[]).forEach(ev=>{ if(ev.date===iso) evs.push({
    kind:'event', id:ev.id, time:ev.time||'', title:ev.title||'Termin',
    sub:[ev.location||'', ev.note||''].filter(Boolean).join(' · '),
    public: ev.public!==false }); });
  return evs.sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99'));
}
function calSetPublic(kind, id, val){
  if(kind==='training'){ const t=S.trainings.find(x=>x.id===id); if(t) t.calPublic=val; }
  else if(kind==='match'){ const m=S.matches.find(x=>x.id===id); if(m) m.calPublic=val; }
  else { const ev=(S.calendarEvents||[]).find(x=>x.id===id); if(ev) ev.public=val; }
  saveAll();
}
function monthDays(ym){
  const [y,m] = ym.split('-').map(Number);
  const lead = (new Date(y, m-1, 1).getDay()+6)%7; /* Montag = 0 */
  const days = new Date(y, m, 0).getDate();
  return { y, m, lead, days };
}
const CAL_DOWS = ['MO','DI','MI','DO','FR','SA','SO'];

function renderKalender(){
  if(!route.calMonth) route.calMonth = ymNow();
  const ym = route.calMonth;
  const { y, m, lead, days } = monthDays(ym);
  const today = todayISO();
  setTopbar('Kalender', ymLabel(ym), `
    <button class="btn btn-ghost btn-sm" id="calPrev" title="Vormonat">${svgI(I.back,15)}</button>
    <button class="btn btn-ghost btn-sm" id="calToday">Heute</button>
    <button class="btn btn-ghost btn-sm" id="calNext" title="Folgemonat">${svgI(I.next,15)}</button>
    <button class="btn btn-ghost" id="calFooterEdit" title="Fußzeile des Eltern-Monatsplans bearbeiten">${svgI(I.edit,14)} Fußzeile</button>
    <button class="btn btn-primary" id="calNewEvent">${svgI(I.plus,15)} Termin</button>
    <button class="btn btn-accent" id="calPrint">${svgI(I.print,15)} Elternplan drucken</button>
  `);

  let cells = '';
  for(let i=0;i<lead;i++) cells += `<div class="cal-day other"></div>`;
  for(let d=1; d<=days; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = calDisplayEvents(iso);
    cells += `
      <div class="cal-day ${iso===today?'today':''}" data-day="${iso}" title="Klick: Termine des Tages">
        <span class="cd-num">${d}</span>
        ${evs.slice(0,3).map(e=>`<span class="cal-evt ${e.kind}">${e.public?'':'🔒 '}${e.time?e.time+' · ':''}${esc(e.title)}</span>`).join('')}
        ${evs.length>3?`<span class="cal-more">+ ${evs.length-3} weitere</span>`:''}
      </div>`;
  }

  $('#view').innerHTML = `
    <div class="card card-pad" style="margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <b style="font-size:16px">${ymLabel(ym)}</b>
      <span class="tiny">Trainings und Spiele erscheinen automatisch · Klick auf einen Tag zeigt alle Termine</span>
      <div class="spacer" style="margin-left:auto;display:flex;gap:12px;font-size:11.5px;font-weight:600;color:var(--ink-2)">
        <span><span class="cal-evt training" style="padding:2px 8px">Training</span></span>
        <span><span class="cal-evt match" style="padding:2px 8px">Spiel</span></span>
        <span><span class="cal-evt event" style="padding:2px 8px">Termin</span></span>
        <span title="Interne Termine erscheinen nicht auf dem Eltern-Monatsplan">🔒 = intern</span>
      </div>
    </div>
    <div class="cal-head-row">${CAL_DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>`;

  $('#calPrev').onclick = ()=>{ route.calMonth = ymShift(ym,-1); render(); };
  $('#calNext').onclick = ()=>{ route.calMonth = ymShift(ym, 1); render(); };
  $('#calToday').onclick = ()=>{ route.calMonth = ymNow(); render(); };
  $('#calNewEvent').onclick = ()=> openEventModal(null, `${y}-${String(m).padStart(2,'0')}-01`);
  $('#calPrint').onclick = ()=> printCalendar(ym);
  $('#calFooterEdit').onclick = editCalendarFooter;
  $$('[data-day]').forEach(el=> el.onclick = ()=> openDayModal(el.dataset.day));
}

/* ---------- Tages-Modal: alle Termine sofort sichtbar ---------- */
function openDayModal(iso){
  const paint = ov => {
    const evs = calDisplayEvents(iso);
    $('#dayBody', ov).innerHTML = evs.length ? evs.map((e,i)=>`
      <div class="day-evt-row">
        <span class="de-time">${esc(e.time||'—')}</span>
        <div class="de-main">
          <b>${esc(e.title)}</b>
          <div class="tiny">${esc(e.sub||'')}</div>
        </div>
        <div class="de-actions">
          <span class="pub-toggle ${e.public?'on':''}" data-pub="${e.kind}|${e.id}" title="${e.public?'Erscheint auf dem Eltern-Monatsplan':'Intern — erscheint NICHT auf dem Eltern-Monatsplan'}">${e.public?svgI(I.globe,11)+' Elternplan':svgI(I.lock,11)+' intern'}</span>
          ${e.kind==='event'
            ? `<button class="icon-btn" data-evedit="${e.id}" title="bearbeiten">${svgI(I.edit,14)}</button>
               <button class="icon-btn" data-evdel2="${e.id}" title="löschen">${svgI(I.trash,14)}</button>`
            : `<button class="icon-btn" data-evopen="${e.kind}|${e.id}" title="öffnen">${svgI(I.eye,14)}</button>`}
        </div>
      </div>`).join('') : '<p class="tiny" style="padding:10px 0">Keine Termine an diesem Tag.</p>';
    $$('[data-pub]', ov).forEach(b=> b.onclick = ()=>{
      const [kind,id] = b.dataset.pub.split('|');
      const e = calDisplayEvents(iso).find(x=>x.kind===kind && x.id===id);
      calSetPublic(kind, id, !(e&&e.public));
      paint(ov);
    });
    $$('[data-evopen]', ov).forEach(b=> b.onclick = ()=>{
      const [kind,id] = b.dataset.evopen.split('|');
      closeModal();
      if(kind==='training') openTrainingForEdit(id); else openMatchForEdit(id);
    });
    $$('[data-evedit]', ov).forEach(b=> b.onclick = ()=>{
      const ev = S.calendarEvents.find(x=>x.id===b.dataset.evedit);
      if(ev) openEventModal(ev, iso);
    });
    $$('[data-evdel2]', ov).forEach(b=> b.onclick = ()=>{
      const ev = S.calendarEvents.find(x=>x.id===b.dataset.evdel2); if(!ev) return;
      confirmDlg('Termin löschen', `„${ev.title}“ wird dauerhaft entfernt.`, 'Löschen', ()=>{
        S.calendarEvents = S.calendarEvents.filter(x=>x.id!==ev.id);
        saveAll(); render(); openDayModal(iso); toast('Termin gelöscht');
      });
    });
  };
  const ov = openModal(`
    <div class="modal-head"><h2>${fmtDLong(iso)}</h2><button class="icon-btn" data-close>${svgI(I.x,16)}</button></div>
    <div class="modal-body" id="dayBody"></div>
    <div class="modal-foot">
      <button class="btn btn-soft" id="dayAddEvent" style="margin-right:auto">${svgI(I.plus,14)} Termin an diesem Tag</button>
      <button class="btn btn-primary" data-close>Schließen</button>
    </div>`, 560);
  paint(ov);
  $('#dayAddEvent', ov).onclick = ()=> openEventModal(null, iso);
}

/* ---------- Termin anlegen / bearbeiten ---------- */
function openEventModal(ev, dateISO){
  const isNew = !ev;
  const e = ev || { id:uid(), title:'', date:dateISO||todayISO(), time:'', location:'', note:'', public:true };
  const ov = openModal(`

/* ---------- Druck: Eltern-Monatsplan (A4 quer, dunkles Design, neutral) ---------- */
function printCalendar(ym){
  const { y, m, lead, days } = monthDays(ym);
  const [monthName, yearStr] = [new Date(y, m-1, 1).toLocaleDateString('de-DE',{month:'long'}), String(y)];
  let cells = '';
  for(let i=0;i<lead;i++) cells += `<div class="mp-day empty"></div>`;
  for(let d=1; d<=days; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = calDisplayEvents(iso).filter(e=>e.public); /* interne Termine NIE auf dem Elternplan */
    cells += `
      <div class="mp-day ${evs.length?'has':''}">
        <span class="num">${d}</span>
        ${evs.map(e=>{
          const t = e.kind==='training' ? 'TRAINING' : e.kind==='match' ? esc((e.title||'SPIEL').replace(/^Spiel /,'').toUpperCase()) : esc((e.title||'TERMIN').toUpperCase());
          const detail = [e.time? (e.time+(e.kind==='match'?' Anstoß':' Uhr')) : '', e.sub||''].filter(Boolean).join('<br>');
          return `<div class="mp-evt ${e.kind}"><div class="t">${t}</div>${detail?`<div class="d">${detail}</div>`:''}</div>`;
        }).join('')}
      </div>`;
  }
  /* Nachlaufende Zellen für ein sauberes Raster */
  const totalCells = lead + days;
  for(let i=totalCells; i<Math.ceil(totalCells/7)*7; i++) cells += `<div class="mp-day empty"></div>`;

  printSheet(`
  <style>@media print{ @page{ size:A4 landscape; margin:0 } body{ background:#0c0d10 } }</style>
  <div class="mp-sheet">
    <div class="mp-top">
      <div class="mp-team">${esc(S.clubName)} ${esc(S.teamName)}</div>
      <div class="mp-title">
        <div class="mp-kicker">Monatsplan</div>
        <h1>${esc(monthName)} <em>${esc(yearStr)}</em></h1>
        <div class="mp-sub">${esc(S.teamName)} · ${esc(S.clubName)} · Saison ${y}/${(y+1)%100}</div>
      </div>
    </div>
    <div class="mp-legend">
      <span><i style="background:#221012;border:1px solid #57181c"></i>Training</span>
      <span><i style="background:#e3000f"></i>Spiel / Testspiel</span>
      <span><i style="background:#1d1f26;border:1px solid #3a3d47"></i>Termin</span>
    </div>
    <div class="mp-dows">${CAL_DOWS.map(d=>`<div class="mp-dow">${d}</div>`).join('')}</div>
    <div class="mp-grid">${cells}</div>
    ${(S.calendarFooter||'').trim()?`<div class="mp-foot">${esc(S.calendarFooter)}</div>`:''}
  </div>`);
}

<script>
'use strict';
/* ============================================================
   SPIEL — Datenerfassung (Sprache · Text · Datei) + Parser
   ============================================================ */
/* Alte Schulnoten (1–6) → Match-Impact (−3…+3) */
const NOTE_TO_IMPACT = {1:3, 2:2, 3:1, 4:0, 5:-2, 6:-3};

function matchPlayerIn(text){
  const t = ' '+lc(text)+' ';
  const hits = [];
  S.players.forEach(p=>{
    const names = [lc(p.name), lc(p.first), ...(p.nick||[]).map(lc)];
    if(names.some(n=> n && new RegExp('(^|[^a-zäöüß])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-zäöüß]|$)').test(t))) hits.push(p);
  });
  return hits;
}

function parseMatchText(text){
  const team = {};
  const rows = {};
  const row = pid => rows[pid] || (rows[pid] = { pid, from:null, to:null, impact:null, tags:[], position:null, events:[], notes:[] });
  const total = S.matchDraft ? (S.matchDraft.totalMinutes||80) : 80;

  splitSentences(text).forEach(sent=>{
    const t = lc(sent);

    /* --- Teaminfos --- */
    let m = sent.match(/(\d{1,2})\s*:\s*(\d{1,2})(?!\s*uhr)/i);
    if(m && (hasAny(t,['gewonnen','verloren','unentschieden','ergebnis','endstand','gespielt','geschlagen']) || (+m[1]<=15 && +m[2]<=15 && !t.includes('uhr')))){
      let gf=+m[1], ga=+m[2];
      if(t.includes('verloren') && gf>ga) [gf,ga]=[ga,gf];
      team.goalsFor=gf; team.goalsAgainst=ga;
    }
    m = sent.match(/[Gg]egen\s+(?:den\s+|die\s+)?([A-ZÄÖÜ][\wÄÖÜäöüß.\- ]{2,32}?)(?=\s+(?:haben|hat|gewonnen|verloren|gespielt|unentschieden|mit|am|um|war|\d)|[,.;!?]|$)/);
    if(m) team.opponent = m[1].trim();
    if(t.includes('pokal')) team.competition='Pokal';
    else if(t.includes('testspiel')||t.includes('freundschaftsspiel')) team.competition='Testspiel';
    else if(t.includes('turnier')) team.competition='Turnier';
    else if(t.includes('liga')) team.competition='Liga';
    m = t.match(/2\s*[x×]\s*(\d{2})/);
    if(m) team.totalMinutes = 2*+m[1];
    m = t.match(/(\d{2,3})\s*minuten?\s*(?:gesamt|spielzeit)/) || t.match(/spielzeit\D{0,10}(\d{2,3})/);
    if(m) team.totalMinutes = +m[1];
    if(hasAny(t,['fazit','insgesamt','als team','die mannschaft','wir haben','erste halbzeit','zweite halbzeit']) && !matchPlayerIn(sent).length){
      team.notes = (team.notes? team.notes+' ' : '') + sent;
    }

    /* --- Spielerinfos --- */
    const players = matchPlayerIn(sent);
    if(!players.length) return;
    const single = players.length===1;
    players.forEach(p=>{
      const r = row(p.id);
      if(single){
        let mm = t.match(/von\s+(?:der\s+)?(\d{1,3})\.?\s*(?:minute\s*)?bis\s+(?:zur\s+)?(?:minute\s+)?(\d{1,3})/);
        if(mm){ r.from=+mm[1]; r.to=+mm[2]; }
        else if(hasAny(t,['durchgespielt','komplett gespielt','volle distanz','von anfang bis ende'])){ r.from=0; r.to=total; }
        else {
          mm = t.match(/eingewechselt\D{0,20}?(\d{1,3})/) || t.match(/(?:ab|in)\s+(?:der\s+)?(\d{1,3})\.?\s*minute\s+(?:eingewechselt|gekommen|rein)/) || (t.includes('eingewechselt') ? t.match(/(\d{1,3})\.?\s*minute/) : null);
          if(mm && t.includes('eingewechselt')){ r.from=+mm[1]; if(r.to==null) r.to=total; }
          mm = t.match(/ausgewechselt\D{0,20}?(\d{1,3})/) || (t.includes('ausgewechselt') ? t.match(/(\d{1,3})\.?\s*minute/) : null);
          if(mm && t.includes('ausgewechselt')){ r.to=+mm[1]; if(r.from==null) r.from=0; }
          mm = t.match(/(\d{1,3})\s*minuten?\s*gespielt/);
          if(mm && r.from==null && r.to==null){ r.from=0; r.to=Math.min(+mm[1], total); }
        }
        /* Impact direkt genannt („Impact +2“) */
        let rm = t.match(/impact\s*(?:von\s*)?([+-−]?\s?\d)/);
        if(rm) r.impact = clamp(parseInt(rm[1].replace('−','-').replace(/\s/g,'')), -3, 3);
        /* Alte Schulnote 1–6 → Impact */
        if(r.impact==null){
          rm = t.match(/note\s+(\d{1,2}(?:[.,]5)?)/);
          if(rm){
            const n=parseFloat(rm[1].replace(',','.'));
            if(n>=1 && n<=6 && !t.includes('von 10') && !t.includes('/10')){
              const lo=NOTE_TO_IMPACT[Math.floor(n)]??0, hi=NOTE_TO_IMPACT[Math.ceil(n)]??0;
              r.impact = clamp(Math.round((lo+hi)/2), -3, 3);
            } else if(n>6 && n<=10){
              r.impact = ratingToImpact(n);
            }
          }
        }
        if(r.impact==null){
          rm = t.match(/(\d{1,2}(?:[.,]\d)?)\s*(?:\/|von)\s*10/);
          if(rm) r.impact = ratingToImpact(parseFloat(rm[1].replace(',','.')));
        }
        for(const [w,pos] of Object.entries(POSWORD)){
          if(t.includes('als '+w) || t.includes('im '+w) || t.includes('auf '+w)){ r.position=pos; break; }
        }
      }
      EVENT_KW.forEach(ek=>{ if(ek.re.test(t)){ for(let k=0;k<ek.n;k++) r.events.push(ek.ev); } });
      if(r.impact==null){
        const pos=hasAny(t,POSWORDS.map(lc)), neg=hasAny(t,NEGWORDS.map(lc));
        if(pos&&!neg) r.impact=1; else if(neg&&!pos) r.impact=-1;
      }
      /* Tags aus fachlichen Erwähnungen ableiten (Technik, Taktik, …) */
      IMPACT_TAGS.forEach(tag=>{
        if(KW[tag.dim] && hasAny(t, KW[tag.dim]) && !r.tags.includes(tag.key)) r.tags.push(tag.key);
      });
      r.notes.push(sent);
    });
  });
  /* Ereignis-Duplikate innerhalb einer Erfassung glätten */
  Object.values(rows).forEach(r=>{
    const uniq=[]; const seen={};
    r.events.forEach(e=>{ seen[e]=(seen[e]||0)+1; });
    Object.entries(seen).forEach(([e,n])=>{ const max = e==='Tor'||e==='Assist' ? n : 1; for(let k=0;k<max;k++) uniq.push(e); });
    r.events=uniq;
  });
  return { team, rows:Object.values(rows) };
}

  $('#mcFile').onclick = ()=> $('#mcFileInput').click();
  $('#mcFileInput').onchange = e=>{ handleUpload(e.target.files[0], txt=>{ $('#mcText').value=txt; runMatchParse(); }); e.target.value=''; };
  $('#mcParse').onclick = runMatchParse;
  $('#mcApply').onclick = ()=>{ if(!matchFindings) runMatchParse(); applyMatchFindings(); };
  if($('#mcClear')) $('#mcClear').onclick = ()=>{ matchFindings=null; render(); };

  $('#mOpp').oninput = e=>{ d.opponent=e.target.value; saveAll(); };
  $('#mtDate').onchange = e=>{ d.date=e.target.value; saveAll(); };
  $('#mGf').oninput = e=>{ d.goalsFor=e.target.value===''?null:+e.target.value; saveAll(); };
  $('#mGa').oninput = e=>{ d.goalsAgainst=e.target.value===''?null:+e.target.value; saveAll(); };
  $('#mTotal').oninput = e=>{ d.totalMinutes=parseInt(e.target.value)||0; saveAll(); };
  $('#mTarget').oninput = e=>{ d.targetMinutes=parseInt(e.target.value)||0; saveAll(); };
  $('#impInfo').onclick = showImpactInfo;
  $('#mType2').onchange = e=>{ d.matchType=e.target.value; saveAll(); toast('Spieltyp gespeichert: '+d.matchType); };
  $('#mTeamNotes').oninput = e=>{ d.teamNotes=e.target.value; saveAll(); };
  $('#mConclusion').oninput = e=>{ d.conclusion=e.target.value; saveAll(); };

  $$('[data-pd]').forEach(el=> el.addEventListener('change', ()=>{
    const [pid,f]=el.dataset.pd.split('|');
    const pd=ensurePD(d,pid);
    if(f==='events') pd.events = el.value.split(',').map(s=>s.trim()).filter(Boolean);
    else if(f==='note') pd.note = el.value;
    else if(f==='position') pd.position = el.value;
    else if(f==='impact') pd.impact = el.value===''?null:clamp(parseInt(el.value),-3,3);
    else pd[f] = el.value===''?null:parseFloat(el.value);
    saveAll(); renderSpiel();
  }));

  /* Tags togglen ohne Re-Render (Fokus bleibt erhalten) */
  $$('[data-tag]').forEach(b=> b.onclick = ()=>{

    saveAll();
  });

  $$('[data-evadd]').forEach(b=> b.onclick = ()=>{
    const [pid,ev]=b.dataset.evadd.split('|');
    const pd=ensurePD(d,pid);

    saveAll(); renderSpiel();
  });
  $$('[data-evdel]').forEach(b=> b.onclick = ()=>{
    const [pid,ei]=b.dataset.evdel.split('|');
    const pd=ensurePD(d,pid);

      d.playerData[pid] = { from:null, to:null, position:p?p.pos:'', impact:null, tags:[], note:'', events:[] };
      saveAll(); renderSpiel(); toast('Zeile zurückgesetzt');
    });
  });

  bindPlayerOpen();
  if(matchFindings) renderMatchFindings();
}

/* Ereignis-Chip-Farbe */
function evtChipCls(e){
  const t = lc(e);
  if(t==='tor'||t==='treffer') return 'tor';
  if(t==='assist'||t==='vorlage') return 'assist';
  if(t.includes('rot')) return 'rot';
  if(t.includes('gelb')) return 'gelb';
  if(t.includes('verletz')) return 'verl';
  return '';
}

function runMatchParse(){
  const text = $('#mcText').value.trim();
  if(!text){ toast('Bitte zuerst Notizen eingeben, diktieren oder hochladen','info'); return; }
  const res = parseMatchText(text);
  matchFindings = {
    team: Object.keys(res.team).length ? {...res.team, on:true} : null,
    rows: res.rows.map(r=>({...r, on:true}))
  };
  if(!matchFindings.team && !matchFindings.rows.length){
    toast('Keine verwertbaren Informationen erkannt','info'); matchFindings=null;
  }
  renderSpiel();
}

function renderMatchFindings(){
  const host = $('#mcFindings'); if(!host || !matchFindings) return;
  const f = matchFindings;
  let html = '';
  if(f.team){
    const parts = [];
    if(f.team.opponent) parts.push('Gegner: <b>'+esc(f.team.opponent)+'</b>');
    if(f.team.goalsFor!=null) parts.push('Ergebnis: <b>'+f.team.goalsFor+' : '+f.team.goalsAgainst+'</b>');
    if(f.team.competition) parts.push('Wettbewerb: <b>'+esc(f.team.competition)+'</b>');
    if(f.team.totalMinutes) parts.push('Spielzeit: <b>'+f.team.totalMinutes+' Min</b>');
    if(f.team.notes) parts.push('Teamnotiz: <i>„'+esc(f.team.notes)+'“</i>');
    html += `<div class="finding ${f.team.on?'':'off'}">
      <button class="f-toggle" data-mft="team">${svgI(I.check,12)}</button>
      <div class="f-main"><b>Teaminfos</b><div class="f-sub">${parts.join(' · ')}</div></div>
      <div class="f-tag"><span class="chip navy">Team</span></div>
    </div>`;
  }
  html += f.rows.map((r,i)=>{
    const p=S.players.find(x=>x.id===r.pid);
    const bits=[];
    if(r.from!=null||r.to!=null) bits.push(`Einsatz <b>${r.from??'?'}’ – ${r.to??'?'}’</b>`);
    if(r.impact!=null) bits.push(`Impact <b class="${impactCls(r.impact)}">${fmtImpact(r.impact)}</b>`);
    if(r.tags&&r.tags.length) bits.push(r.tags.map(t=>`<span class="chip" style="font-size:10px;padding:1px 7px">${esc(t)}</span>`).join(' '));
    if(r.position) bits.push(`Position <b>${r.position}</b>`);
    if(r.events.length) bits.push(r.events.map(e=>`<span class="chip ${e==='Tor'?'green':e.includes('Karte')||e==='Gelb-Rot'?'amber':e==='Verletzung'?'red':'blue'}" style="font-size:10px;padding:1px 7px">${e}</span>`).join(' '));
    return `<div class="finding ${r.on?'':'off'}">
      <button class="f-toggle" data-mft="${i}">${svgI(I.check,12)}</button>
      <div class="f-main"><b>${esc(p?p.name:'?')}</b>
        <div class="f-sub">${bits.join(' · ')||'Notiz'}</div>
        <div class="f-sub" style="font-style:italic">„${esc(r.notes.join(' '))}“</div>
      </div>
    </div>`;
  }).join('');
  host.innerHTML = html || '<p class="tiny">Nichts erkannt.</p>';
  $$('[data-mft]', host).forEach(b=> b.onclick = ()=>{
    if(b.dataset.mft==='team') f.team.on=!f.team.on;
    else f.rows[+b.dataset.mft].on=!f.rows[+b.dataset.mft].on;
    renderMatchFindings();
    $$('[data-mft]',host); /* re-bound in renderMatchFindings */
  });
}

function applyMatchFindings(){
  if(!matchFindings){ return; }
  const d = S.matchDraft;
  let n=0;
  const f = matchFindings;
  if(f.team && f.team.on){
    if(f.team.opponent) d.opponent=f.team.opponent;
    if(f.team.goalsFor!=null){ d.goalsFor=f.team.goalsFor; d.goalsAgainst=f.team.goalsAgainst; }
    if(f.team.competition){ d.competition=f.team.competition; d.matchType = mapCompetitionToType(f.team.competition); }
    if(f.team.totalMinutes) d.totalMinutes=f.team.totalMinutes;
    if(f.team.notes) d.teamNotes = (d.teamNotes? d.teamNotes+' ':'') + f.team.notes;
    n++;
  }
  f.rows.filter(r=>r.on).forEach(r=>{
    const pd = ensurePD(d, r.pid);
    if(r.from!=null) pd.from=r.from;
    if(r.to!=null) pd.to=r.to;
    if(r.impact!=null) pd.impact=r.impact;
    if(r.tags&&r.tags.length) pd.tags=[...new Set([...(pd.tags||[]), ...r.tags])];
    if(r.position) pd.position=r.position;
    if(r.events.length) pd.events=[...(pd.events||[]), ...r.events];
    if(r.notes.length) pd.note = ((pd.note||'')+' '+r.notes.join(' ')).trim();
    const p=S.players.find(x=>x.id===r.pid);
    if(p){
      if(r.events.includes('Verletzung')){ p.status='angeschlagen'; logHist(p.id,'Aus Spielerfassung: Verletzung vermerkt'); }
      logHist(p.id, `Spieldaten ${d.opponent?('vs. '+d.opponent):''} übernommen${r.impact!=null?': Impact '+fmtImpact(r.impact):''}${r.events.length?', '+r.events.join(', '):''}`);
    }
    n++;
  });
  matchFindings=null;
  $('#mcText') && ($('#mcText').value='');
  saveAll(); renderSpiel();
  toast(n? `${n} ${n>1?'Einträge':'Eintrag'} übernommen — bitte prüfen und speichern` : 'Nichts ausgewählt', n?'check':'info');
}

/* ============================================================
   SPIELBLATT — DIN A4, eine Seite, zum händischen Ausfüllen
   Funktioniert für F-Jugend (viele Tore: Zählkästchen) genauso
   wie für A-Jugend (0:0: viel Raum für Notizen & Wechsel).
   ============================================================ */
function tickboxHTML(n, filled){
  filled = Math.min(filled||0, n);
  return `<span class="tickboxes">${Array.from({length:n},(_,i)=>`<i class="${i<filled?'filled':''}"></i>`).join('')}</span>`;
}
function printMatchSheet(m){
  const byId = pid => S.players.find(p=>p.id===pid);
  const startelf = m.lineup.field.slice().sort((a,b)=> b.y-a.y || a.x-b.x).map(f=>byId(f.pid)).filter(Boolean);
  const bench = m.lineup.bench.map(byId).filter(Boolean).sort((a,b)=>(a.num||99)-(b.num||99));
  if(!startelf.length && !bench.length){ toast('Noch keine Spieler nominiert — erst den Kader festlegen','info'); return; }
  const mp = m.matchPlan || emptyMatchPlan();
  const mpItems = MATCHPLAN_FIELDS.filter(f=>(mp[f.key]||'').trim());
  const stdRows = (m.standardNames||[]).filter(r=>(r.role||'').trim()||(r.name||'').trim());
  const row = (p, cls) => {
    const pd = (m.playerData||{})[p.id] || {};
    const goals = (pd.events||[]).filter(e=>lc(e)==='tor').length;
    const assists = (pd.events||[]).filter(e=>lc(e)==='assist'||lc(e)==='vorlage').length;
    return `<tr class="${cls||''}">
      <td><b>${p.num||''}</b></td>
      <td class="nm">${esc(p.name)}</td>
      <td>${esc(pd.position||p.pos)}</td>
      <td>${cls==='bench-sep'||bench.includes(p)?'B':'S'}</td>
      <td><span class="ms-mini">${pd.from??''}</span>–<span class="ms-mini">${pd.to??''}</span></td>
      <td>${tickboxHTML(8, goals)}${goals>8?` +${goals-8}`:''}</td>
      <td>${tickboxHTML(6, assists)}</td>
      <td>${tickboxHTML(1,(pd.events||[]).some(e=>lc(e).includes('gelb')&&!lc(e).includes('rot'))?1:0)} ${tickboxHTML(1,(pd.events||[]).some(e=>lc(e).includes('rot'))?1:0)}</td>
      <td style="width:26%">${(pd.note||'').trim()?`<span style="font-size:8px">${esc(pd.note)}</span>`:''}</td>
    </tr>`;
  };
  printSheet(`
  <style>@media print{ @page{ size:A4; margin:9mm 10mm } }</style>
  <div class="ms-sheet">
    <div class="ms-head">
      <div>
        <div class="ms-club">${esc(S.clubName)} · ${esc(S.teamName)} · Spielblatt</div>
        <h1>${esc(S.clubName)} ${esc(S.teamName)} — ${esc(m.opponent||'Gegner')}</h1>
      </div>
      <div style="text-align:right;font-size:9px;line-height:1.5">
        <b>${fmtDLong(m.date)}</b><br>
        Anstoß ${esc(m.time||'–')} Uhr · ${esc(m.venue||'')} · ${esc(m.matchType||'Ligaspiel')}
      </div>
      <div class="ms-score"><span>Endstand</span><b>___ : ___</b></div>
    </div>

    <div class="ms-info">
      <div class="mi w2"><b>Treffpunkt</b><span>${esc(m.meeting||'')}&nbsp;</span></div>
      <div class="mi w2"><b>Adresse</b><span>${esc(m.address||'')}&nbsp;</span></div>
      <div class="mi"><b>Spielzeit</b><span>${m.totalMinutes||'—'} Min</span></div>
      <div class="mi"><b>100% = </b><span>${m.targetMinutes||m.totalMinutes||'—'} Min</span></div>
    </div>

    <table class="ms-table">
      <thead><tr>
        <th style="width:4%">#</th><th style="width:17%">Spieler</th><th style="width:5%">Pos</th><th style="width:4%">S/B</th>
        <th style="width:11%">Von – Bis</th><th style="width:13%">Tore</th><th style="width:10%">Vorlagen</th><th style="width:6%">G · R</th><th>Kurznotiz</th>
      </tr></thead>
      <tbody>
        ${startelf.map(p=>row(p)).join('')}
        ${bench.map((p,i)=>row(p, i===0?'bench-sep':'')).join('')}
      </tbody>
    </table>

    <div class="ms-cols">
      <div>
        <div class="ms-box">
          <h3>Wechsel & Ereignisse (Minute · wer/was)</h3>
          ${Array.from({length:8},()=>`<div class="ms-ev-row"><span>Min ____</span><span style="flex:1"></span></div>`).join('')}
        </div>
        <div class="ms-box">
          <h3>Team-Fazit</h3>
          ${(m.conclusion||'').trim()?`<div class="ms-txt">${esc(m.conclusion)}</div>`:''}
          <div class="ms-line"></div><div class="ms-line"></div><div class="ms-line"></div>
        </div>
        ${(m.teamNotes||'').trim()?`<div class="ms-box"><h3>Teamnotizen</h3><div class="ms-txt">${esc(m.teamNotes)}</div></div>`:''}
      </div>
      <div>
        <div class="ms-box">
          <h3>Matchplan</h3>
          ${mpItems.length? mpItems.slice(0,6).map(f=>`<div class="ms-kv"><b>${esc(f.label)}:</b> ${esc(mp[f.key])}</div>`).join('')
            : '<div class="ms-line"></div><div class="ms-line"></div><div class="ms-line"></div>'}
        </div>
        <div class="ms-box">
          <h3>Standards allgemein</h3>
          ${(m.generalStandards||'').trim()? `<div class="ms-txt">${esc(m.generalStandards)}</div>` : '<div class="ms-line"></div><div class="ms-line"></div><div class="ms-line"></div>'}
          ${stdRows.length?`<div class="ms-roles" style="margin-top:4px">${stdRows.map(r=>`<div class="ms-role"><b>${esc(r.role||'—')}:</b> <span>${esc(r.name||'')}</span></div>`).join('')}</div>`:''}
        </div>
      </div>
    </div>
    <div style="margin-top:4px;font-size:7px;color:#667085">Nach dem Spiel: Blatt fotografieren und in der App unter „Spiel → Auswertung → Spielblatt übertragen“ hochladen — erkennen, prüfen, übernehmen.</div>
  </div>`);
}

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  S = loadAll();
  if(!S || typeof S !== 'object' || !Array.isArray(S.players)){
    S = freshState();
    seedFirstMatch(S);
  }
  migrateState(S); /* v1/v2-Daten automatisch und verlustfrei anheben (idempotent) */
  syncRatingModel();
  saveAll();
  render();
})();
</script>
</body>
</html>
